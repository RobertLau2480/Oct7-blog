tle\">随笔<\/div>\n    <p class=\"shelf-desc\">生活里的点滴<\/p>\n  <\/a>\n\n  <a href=\"/杂谈/index.html\" class=\"shelf-card\">\n    <div class=\"shelf-icon\">💭<\/div>\n    <div class=\"shelf-title\">杂谈<\/div>\n    <p class=\"shelf-desc\">我想和屏幕前的你聊聊<\/p>\n  <\/a>\n  <\/div>\n<\/div>\n","content/关于.md":"<h1>关于本站<\/h1>\r\n<p>安巢鸟的个人网站简介。不基于 Quartz V5 搭建，源码已开源至 GitHub。记录素材来源、版权声明与联系方式。<\/p>\r\n\r\n<style>\r\n.about-section {\r\n  max-width: 680px;\r\n  margin: 0 auto;\r\n  text-align: center;\r\n  line-height: 1.9;\r\n  font-size: 0.98rem;\r\n  color: var(--darkgray);\r\n  padding: 1rem 0;\r\n}\r\nhtml[data-theme=\"dark\"] .about-section,\r\nhtml[saved-theme=\"dark\"] .about-section {\r\n  color: #b8b8b8;\r\n}\r\n.about-divider {\r\n  width: 48px;\r\n  height: 2px;\r\n  background: var(--secondary);\r\n  margin: 2rem auto;\r\n  opacity: 0.4;\r\n  border-radius: 2px;\r\n}\r\n<\/style>\r\n\r\n<div class=\"about-section\">\r\n\r\n> \"写作是对抗遗忘的方式。\"\r\n\r\n这里是安的个人网站，希望这里能成为你我之间沟通的桥梁。\r\n\r\n本网站不基于 Quartz V5 搭建，[源码已开源至 Github](https://github.com/HomewardBird/First_single_blog)。<br>感谢 OctSeventh 的帮助。（他的网站：[https://octseven.us.kg/](https://octseven.us.kg/)）\r\n\r\n<div class=\"about-divider\"><\/div>\r\n\r\n<h3>版权与来源声明<\/h3>\r\n\r\n<p style=\"font-size:0.92rem; text-align:left;\">\r\n本站部分素材来源于网络，若涉及侵权，请联系 <a href=\"mailto:birdhomeward@gmail.com\" target=\"_blank\">birdhomeward@gmail.com<\/a> 删除。\r\n<\/p>\r\n\r\n<p style=\"font-size:0.85rem; opacity:0.72; text-align:left; line-height:2;\">\r\n<b>背景视频：<\/b><br>\r\n&emsp;浅色主题（PC端） — <i>Wallpaper engine，作者：lazty栗子，作品名：【明日方舟】 夕-山河万象（4K）<\/i><br>\r\n&emsp;暗色主题（PC端） — <i>Wallpaper engine，作者：BaKamk，作品名：明日方舟 夕<\/i><br>\r\n&emsp;手机端 — <i>明日方舟官图<\/i><br>\r\n<br>\r\n<b>背景音乐：<\/b><br>\r\n&emsp;Coffee Cats、Welcome School — <i>蔚蓝档案官方音乐<\/i><br>\r\n&emsp;希望的明日、玉磬漻漻、风清月白 — <i>原神官方音乐<\/i><br>\r\n&emsp;ornave-lofi-moon-light、monume-lofi-chill、mao690276、lofidreams-cozy-lofi、apalonbeats-lofi — <i>Pixabay Music<\/i>\r\n<\/p>\r\n\r\n<p style=\"font-size:0.85rem; opacity:0.65; text-align:left; margin-top:1rem;\">\r\n<b>本站内容声明：<\/b><br>\r\n&emsp;除特别注明外，本站文章及图片均为原创，可在标明出处的前提下进行二创。\r\n<\/p>\r\n\r\n<\/div>\r\n","content/杂谈/01 网名的故事.md":"<h2>网名的故事<\/h2>\n我想写的，是我的网名——**安巢鸟**。第一次听，甚至可能会觉得有点奇怪。\n\n事情大概要从半年前说起。那天，我想起来自己的B站账号还缺个正式的网名（其实就是之前太懒，一直随便顶着个名凑合）。作为一个不折不扣的“取名废”，只能想到安这个网名（源自我的姓氏），而且我也喜欢这个字，安静，安宁 ，~~（与我咋咋呼呼的性格互补了说是）~~       \n\n偶然在西窗烛中看见了杜甫的《洗兵马》\n  \n>**东走无复忆鲈鱼，南飞觉有安巢鸟。**  \n\n这首诗初看，便惊艳到我了，杜甫一贯的沉郁顿挫的风格，现实与理想的结合，总之，我很喜欢这首诗。 再加上由于 《鸟之诗》 以及其他作品的影响，我也很喜欢鸟这个意向，他们自由翱翔于天地之间。所以这个网名也就出现了。      \n\n既然开发了评论功能，我也很好奇：各位的网名背后，都有着怎样的故事呢？欢迎在评论区分享给我呀，感谢 o(^▽^)o","content/杂谈/02 流程图和时序图示例.md":"# 流程图与时序图示例\r\n\r\n本文展示博客对 **Mermaid 流程图**、**时序图** 以及 **数学公式** 的支持。\r\n\r\n## 流程图\r\n\r\n> [!tip] 提示\r\n> 流程图使用 ` ```mermaid ` 代码块编写，支持 `graph`、`flowchart` 等关键字。\r\n\r\n```mermaid\r\nflowchart TD\r\n    A[开始] --> B{是否周末？}\r\n    B -- 是 --> C[睡懒觉 🛏️]\r\n    B -- 否 --> D[起床搬砖 💼]\r\n    C --> E[出门玩 🎮]\r\n    D --> F[下班回家 🏠]\r\n    E --> G[结束]\r\n    F --> G\r\n```\r\n\r\n## 时序图\r\n\r\n> [!info] 说明\r\n> 时序图用于描述对象之间的消息交互顺序。\r\n\r\n```mermaid\r\nsequenceDiagram\r\n    participant 用户 as 👤 用户\r\n    participant 浏览器 as 🌐 浏览器\r\n    participant 服务器 as 🖥️ 服务器\r\n    participant 数据库 as 🗄️ 数据库\r\n\r\n    用户->>浏览器: 点击文章链接\r\n    浏览器->>服务器: GET /文章.html\r\n    服务器->>数据库: 查询文章内容\r\n    数据库-->>服务器: 返回 Markdown\r\n    服务器-->>浏览器: 返回完整 HTML\r\n    浏览器-->>用户: 渲染页面（SPA 不刷新）\r\n```\r\n\r\n## 数学公式\r\n\r\n行内公式：$E = mc^2$\r\n\r\n块级公式：\r\n\r\n$$\r\n\\int_0^\\infty e^{-x^2} \\, dx = \\frac{\\sqrt{\\pi}}{2}\r\n$$\r\n\r\n## Markdown 基础语法\r\n\r\n- **加粗**、*斜体*、~~删除线~~\r\n- 表格、列表、引用\r\n\r\n| 功能 | 支持情况 |\r\n|------|----------|\r\n| 流程图 | ✅ |\r\n| 时序图 | ✅ |\r\n| 数学公式 | ✅ |\r\n| Obsidian 语法 | ✅ |","content/杂谈/index.md":"<h1>杂谈<\/h1>\n这个专栏中，我想和屏幕前的你聊聊。","content/留言.md":"<h1>留言板<\/h1>\n<p>欢迎在安巢鸟的博客留言板留下您的足迹。登录 GitHub 账号即可留言交流，评论由 Giscus 驱动。\n\n\n<style>\n.guestbook-intro {\n  text-align: center;\n  padding: 1.5rem 1rem 0;\n  color: var(--darkgray);\n}\nhtml[data-theme=\"dark\"] .guestbook-intro,\nhtml[saved-theme=\"dark\"] .guestbook-intro {\n  color: #b8b8b8;\n}\n<\/style>\n\n<div class=\"guestbook-intro\">\n  <p>欢迎留下您的足迹，任何想法、建议或闲聊都很欢迎 🌟<\/p>\n  <p>评论按点赞递减排列，若您看到了您认为有用的评论请不要吝啬自己的赞<\/p>\n  <p>若有人回复了您的评论，在Github中收件箱可以收到<\/p>\n  <p style=\"font-size:0.85rem;opacity:0.6;\">评论由 Giscus 驱动，需登录 GitHub 账号<\/p>\n<\/div>\n","content/计算机入门指南/index.md":"<h2>计算机入门指南<\/h2>\n种下一棵树最好的时间是十年前，其次是现在。而笔者动笔的契机，是偶然读到了 Hans Wan 和 Windy Deng 编写的个人博客《你缺失的那门计算机课》。而在自己摸索电脑、屡屡碰壁又屡屡得到前人帮助的过程中，笔者深感“薪火相传”的必要性——等我有能力了，也一定要反哺这个社区。\n\n恰逢高考结束的这个暑假，在与这届毕业的高三学长们交流后，笔者愈发觉得这件事迫在眉睫。于是，这个博客诞生了。\n\n这个博客不会把重心聚焦在具体软件的使用（但重要的也会稍微讲点），笔者更希望教给大家解决问题的思路，AI 篇也是如此，笔者更想聊聊提示词背后的构建逻辑，而不是简单粗暴地甩给你一大坨所谓的复制即用，但换个场景或 AI 迭代后就失效的 Prompt。\n\n最后，笔者希望大家将 **人人为我，我为人人** 的互联网精神传承下去，遇到有困难的新手出一份力。\n\n由于笔者才疏学浅，若文中有任何硬伤或不妥之处，强烈欢迎各位读者老爷指出，评论功能的话暂时不打算开发，敬请谅解。\n\n- **联系方式**： birdhomeward@gmail.com（由于笔者刚入高二，学业压力较大，可能没法及时回复，抱歉）\n- 💡 **本站图片版权声明**：本博客文章除部分图片引用自厂商公开宣传素材或遵循 CC 协议的开源社区外，其余实操图片均为笔者原创。如有侵权，请联系  birdhomeward@gmail.com，笔者将第一时间配合删除。","content/计算机入门指南/基础入门/01 硬件相关知识.md":"（此篇写于2026年7月。具体硬件推荐或价格都基于当前情况书写）\n## 前言\n（书写时间为2026.7，知识部分未来短时间内大概通用，但型号推荐仅供参考）\n\n装过台式机的朋友，大概都体验过挑选主板、CPU、显卡等配件时的纠结；哪怕是电脑小白，多半也刷到过“5060”之类的配置字眼。\n\n这篇博客不想去卷各大品牌的跑分对比，只想用通俗的语言，带你搞懂每个部件到底是干嘛的，以及如何判断好坏——**防止去电脑城或者网购时，被黑心老板当肥羊宰。** 若读完有兴趣了解更多知识，请搜索硬件茶谈相关视频。    \n### 主板\n\n主板主板，顾名思义，就是一块板子，你的绝大部分电脑配件都安装在上面，外设一般与主板相连。（使用独立显卡时，显示器需连接至独立显卡的视频输出接口，而非主板的显示输出口）         \n\n<center>下图展示的便是华硕 (ASUS) TUF GAMING Z590-PLUS WIFI 主板<\/center>\n\n![[主板.jpg#pic_center|219]]\n\n<center><small>图片来源：Unsplash License / 作者：Andrey Matveev<\/small><\/center>\n\n#### 基础功能：\n（可以理解成军事基地）\n1. 提供场地（即物理载体，否则你的配件怎么固定呢）\n2. 后勤保障（即供电，主板上有复杂的供电模块（VRM））\n3. 交通公路（即数据通路，主板上密密麻麻的电路）\n\n由于主板知识较为复杂，在此不过多赘述      \n新手要注意的就是你所购买的主板与你的 CPU 是否兼容，内存条插槽为 DDR4 还是 DDR5 ，还有芯片组的档次（如Intel的H/B/Z系列，AMD的A/B/X系列）。笔者推荐多数用户选择B系列（Intel）或B系列（AMD），预算有限可选入门级，需要超频或扩展性可选Z/X系列。\n\n\n### CPU\n\n<center>下图为英特尔酷睿 i9-10900        <\/center>\n\n![[CPU.jpg#pic_center|230]]\n\n<center><small>图片来源：Unsplash License / 作者：Andrey Matveev<\/small><\/center>\n\n非常重要的配件，沿用刚才的军事比喻的话就类似于将军，负责战术计算，核心决策 ~~（怪不得人家中文名叫中央处理器）~~ 。总而言之就是给所有硬件下达命令的。\n\n虽然从外表看是一块方形基板，但其内部集成了多个核心和缓存等复杂电路。“双核”、“四核”就是指它的核心数。   \n\n核心越多，工作效率肯定越快……吗？实则不然。在架构相同的前提下，我们可以简单套用一个粗暴的公式：**性能 = 核心数 $\\times$ 主频**。（这只是极端简化的类比）有时候 $10 \\times 1 < 1 \\times 100$ 的道理大家都懂。 为了防止核心多但是工作能力差的情况出现，就有了 “主频” 的概念。它代表 CPU 的时钟频率（CPU内部的数字信号每秒钟震荡的次数，也就是CPU工作的速度）。        \n\n若CPU内部同时包含高性能核心和能效核心，则称为‘大小核’异构架构（Intel称混合架构），可更好地平衡性能与功耗。Windows11系统就针对大小核有专门的优化。还有一个概念叫线程数，也就是能同时处理多个任务。\n\n并不是说核心数越多、主频越高的处理器性能就一定强，这在实际应用中是一个十分复杂的综合平衡关系。\n\n#### 常见型号：\n\n两家厂商在主流消费市场都很有默契地把产品分成了 3、5、7、9 四个档次（类似宝马的3系、5系、7系）：\n1. **入门/办公**：i3 / R3（注：AMD 的 3 系列近几年在零售市场存在感较低）\n2. **主流游戏/高性价比**：i5 / R5 / Ultra 5（目前两家都在打架的主战场）\n3. **高端生产力/发烧友**：i7 / i9 / R7 / R9\n\n\n#### **防坑指南：**   \n不要盲目迷信数字！**并不是叫 i7 就一定强于 i5。** 电子产品买新不买旧，隔代如隔山。拿好几年前的老旧 i7 去碰瓷今年的最新款 i5，只会被沦为路边一条。（但具体需结合性能评测判断，并非每一代都有质的飞跃。）\n\n至于之前让人诟病的 i9-13900K/14900K 闪退风波，懂的都懂，新手不碰顶配基本踩不到这个雷，在此不作展开。                 \n\n倒是可以解释一下CPU名字的意思，如英特尔 i9-13900K，i9 不解释了，13 是指第 13 代， 900 指性能档次。一般来说同代中数字越大，核心越多、频率更高、性能越强，K是后缀，具体意思见下表，AMD（以 Ryzen 7 7800X3D 为例），前缀 Ryzen 7 对应档次，编号 7800 中的第一个 7 代表 7000 系列代际（数字越大越新），第二位的 8 代表该系列里的中高端性能位阶，X3D 为后缀。\n\n| 厂商        | 后缀      | 解释与建议                                   |\n| --------- | ------- | --------------------------------------- |\n| **Intel** | **无后缀** | 自带核显，不支持 CPU 倍频超频（但支持内存 XMP 超频）、日常用最省心。 |\n| **Intel** | **K**   | 性能最强，支持倍频超频，但发热大、需要好散热。                 |\n| **Intel** | **F**   | 砍掉了内置显卡。**性价比最高**，但必须搭配独立显卡使用。          |\n| **Intel** | **KF**  | 既能超频又没有核显。游戏发烧友最爱，性价比高。                 |\n| **AMD**   | **无后缀** | 功耗低、发热小。性价比极高，以当前AM5平台为例，通常自带基础核显。      |\n| **AMD**   | **X**   | 官方帮你“超频”好了的型号，性能比无后缀略强。                 |\n| **AMD**   | **X3D** | **游戏神器！** 玩游戏的帧率极高。                     |\n| **AMD**   | **G**   | 处理器内置了性能较强的核显。**不买独显**也能流畅玩轻度游戏。        |\n\n#### **装机注意事项：** \n1. 注意与主板是否匹配，这两家CPU主板不互通。\n2. 有防呆设计（防止你装反），所以发现放不进去时，请去检查是不是没有对准，不要大力出奇迹弄坏针脚。\n3. 注意撕膜，CPU散热器（即风冷 or 水冷）底座有层膜，不撕无法散热，CPU温度会异常。\n4. CPU 表面必须涂抹适量导热硅脂，这玩意 *“当你觉得少了点“*  说明刚好，笔者一般是九点涂法（点九个小点）。\n5. 如果买了带有 **F** 尾缀（如 i5-14400F）或购买不带核显的AMD处理器（如所有非G后缀的AM4平台Ryzen，以及部分AM5早期型号），**必须要额外购买独立显卡** 且显示器与独立显卡连接，否则无法亮屏。\n\n### 内存条（RAM）\n\n笔者写下此篇时，由于AI的原因，内存条和金条一样贵，令人感慨。话说回来，内存条类似军营中传令兵，负责把将军马上要用的文件和命令临时放在身边，方便随时调阅。（务必注意，RAM内存条断电就会失去一切存储信息，和硬盘（SSD/HDD）不同。）        \n\n内存条（RAM）比较重要的概念，笔者认为是世代代号（ DDR ）和工作频率（ MHz ）。它们决定了内存与 CPU 之间的数据传输带宽。带宽越大，数据送达 CPU 的速度就越快，不仅能防止 CPU 闲置“发呆”，还能显著提升游戏的最低帧（1% Low 帧），让游戏画面减少突然的卡顿。至于大家在测评时看到的所谓时序的概念，就是指内存条响应 CPU 指令的延迟时间。具体过程极其复杂。（至于高端颗粒超频等笔者不在此讲解，因为笔者认为这并不适合电脑小白。）\n> [!info]- 点击展开：时序小科普\n> 时序是一组延迟参数（如CL-tRCD-tRP-tRAS），其中CL最为关键，数值越小，内存响应速度越快。但需结合频率综合判断延迟。DDR5 的 6000 ，6400 ，6800 MHz 笔者推荐的甜品时序分别为 CL 30，32，34。\n\n![[RAM.jpg#pic_center|347]]\n<center><small>图片来源：Unsplash License / 作者：Andrey Matveev（没看走眼的话这应该是 Goodram IRDM Pro 系列 DDR4 内存条）<\/small><\/center>\n\n#### 作用：\n\n1. 临时数据中转站：由于下文介绍的硬盘（SSD/HDD）速度较慢，CPU来不及处理的或者要随时调用的数据，就先暂时存放在此。\n2. 决定处理多任务的能力：相信大家买手机都有 “16+512” 这种选项，虽然手机厂商在你那512GB存储空间不够时也会说 “内存不足” ，但请读者理解，电脑上的内存就是指前面的 16，大家之所以要买大内存的手机，应该是为了游戏，微信，QQ，挂后台不被手机 “杀” 了，正是因为内存条在后台把这些程序的运行数据同时 “兜住” 。\n\n\n#### 产品迭代：\n\n1. 低频 DDR4（如 2133 MHz、2400MHz ）及更早的 DDR3，若不是读者有意购买，那就是被老板坑了，旧时代的电子小垃圾。\n2. 若为老电脑升级或预算低，高频 DDR4 可以考虑，技术极其成熟，价格已经跌到谷底，时序（延迟）非常低。但是上限被锁死，其他配件也注定落后。\n3. 大部分人的选择应该是 DDR5 内存，这个主要看个人预算，**以及和主板，CPU 的适配性**\n\n#### 小贴士：\n\n1. 现在内存条大多购买两根，**千万不要买两个工作频率不同的内存条！** 电脑只会向下兼容。\n2. 内存条组装时也有防呆设计，请勿大力出奇迹。\n3. 装机时建议优先插入主板标注为 DIMM_A2 和 DIMM_B2 的插槽（通常是从CPU侧数第2和第4个插槽），具体可参考主板说明书。**绝对不能乱插** 。\n4. 笔者个人推荐若日常使用，16 GB 内存就够用，若有更高的需求，如生产力，游戏，那建议32 GB 起步 。运行频率的话，DDR5 时代 6000 MHz - 6800MHz 完全够用。（笔者观点一直是根据预算选择，先保证容量再去想别的，所以不要为了这些把32 GB 的换成16 GB 的，得不偿失）\n5. 电脑到手重启时狂按Delete（不同主板方式可能不同，如联想为F1，惠普为F10，若不确定，可询问客服 or 售后）进入bios界面，开启 XMP / EXPO，否则内存条频率会自动降低，白花钱购买高频率内存条。\n\n### 显卡（GPU）\n（显卡知识较多）\n\n终于来到了常规电脑中最贵的一部分了（严格来说，GPU是显卡上的核心芯片，显卡则包含GPU、显存、供电、散热等完整组件。但日常语境中两者常混用，本文也是如此），继续用兵营式比喻就类似于冲锋骑兵，负责大规模冲锋，即图像渲染和大计算量工作，大家在部分软件（如 Wallpaper Engine）中见到的“硬件加速”就是指使用显卡加速。\n\n再说到另一个极其重要的概念——显存。当 GPU 在疯狂计算时，数据是怎么来的呢？ CPU 靠内存条提供，而GPU就靠显存，所以可以将显存理解为专属于显卡的高速内存。此外，显卡算完的每一帧画面，在真正显示到你屏幕上的前一秒，都必须暂存在显存的“帧缓冲区”，若显存太小，可能导致游戏画面瞬间卡成幻灯片、动态贴图变马赛克、甚至游戏直接闪退。（共享显存≠独立显存，前者速度较慢）    \n\n还有一个概念叫位宽，单位为bit。指 GPU 显存控制器与显存芯片之间数据总线的宽度，单位为bit。位宽越大，每个时钟周期可传输的数据量越大。显存带宽 = 位宽 × 频率 ×（每时钟传输次数），大家可以把显卡理解成仓库，可将位宽理解为出入口的宽度。越宽，单次能运输的数据越多。所以不要看到16 GB 显存就认为是好显卡，仓库大小固然重要，但只有一个很窄的出入口啥用没有。（当年市场上的RTX 3060 12GB 和RTX 3060 8GB。8G 版本不只是显存小了，它的显存位宽也被硬生生阉割了一截，所以买卡看清具体规格参数，不能只看型号的前半截或者只看显存）\n\n显卡有集成显卡（简称为核显或集显）和独立显卡（简称为独显）的区别，前者就是将 GPU 整合在 CPU 内部，性能相对于独立显卡而言较差，后者就是大家常见的一长条的形式，将GPU独立出来，性能较好。\n\n现在显卡主要厂商有两家分别是英伟达（NVIDIA），超威半导体（AMD），也是俗称的“绿厂”和“红厂”。（还有英特尔（Intel）和中国的摩尔线程等，但笔者认为新手没必要购买红绿厂之外的显卡，故不过多赘述）     \n\n（笔者建议大家使用显卡支架，防止显卡下垂或插槽变形，当然假如你不想买，拿个裁剪到合适长度的一次性筷子也是可以的，但比较难刚好卡住）\n\n![[GPU.jpg|248]] ![[支架.jpg|252]] \n<small>左图来源：Unsplash License / 作者：Andrey Matveev（显卡应该是NVIDIA GeForce RTX 2080 Super Founders Edition）右图为笔者电脑的\"显卡支架\"<\/small>\n\n\n>现在互联网上总给人一种人均4090,5090的错觉，仿佛别的显卡都不配叫显卡一样，笔者劝大家莫要盲目购买高配置，按照需求和预算来永远是最好的。毕竟真正使用人数最多的还是3060。\n\n#### 产品选择：\n（这一块每个人有各自看法，笔者只是给出我的观点，欢迎在评论区讨论）\n\n1. 1080P区 ~~（注：这是指分辨率而不是人数）~~：假如预算有限，显示器分辨率也不高，可以购买RTX 3060 12G / RTX 4060 / RX 6600。（3060是真好用）\n2. 2K过渡区：若预算中等，建议考虑RX 7700 XT / RX 6750 GRE / RTX 4060 Ti (8G)。\n3. 2K进阶/4K初步：预算在中等和顶配之间，建议RX 9070 (16G)、RTX 4070 / 5070 (12G)\n4. 4K顶配区：若预算极高，建议RTX 4080 / 5080 / 4090、RX 9070 XT等高端大显卡。\n（我去了，笔者刚写完没多久，显卡雷霆涨价，气笑了）\n\n***特别提示*** ：显卡型号是指GPU型号，可以理解成汽车发动机，但是外壳由非公版显卡厂商（比如华硕、七彩虹、微星、蓝宝石、讯景）制作，所以同一个显卡价格天差地别。具体可看下表。\n\n| **品牌 (芯片阵营)**           | **实用/性价比系列**                | **中高端/旗舰系列**                    | **小白选购避坑总结**                               |\n| ----------------------- | --------------------------- | ------------------------------- | ------------------------------------------ |\n| **华硕 ASUS** (N卡/A卡)     | Dual (雪豹/巨手) / TUF Gaming   | ROG Strix (猛禽)                  | Dual 散热扎实且价格亲民；ROG 溢价较高，追求极限用料选            |\n| **微星 MSI** (N卡/A卡)      | Ventus (万图师)                | Gaming Slim (魔龙) / SUPRIM (超龙)  | 万图师用料和散热中规中矩，胜在价格便宜；魔龙/超龙散热和静音表现更出色        |\n| **七彩虹 Colorful** (N卡)   | Battle-Ax (战斧)              | Ultra W / Vulcan (火神) / Neptune | 战斧/Ultra 颜值高且支持个人送保具体政策以官方最新公告为准）售后对小白非常友好 |\n| **技嘉 GIGABYTE** (N卡/A卡) | Windforce (风魔) / Eagle (猎鹰) | Gaming OC (魔鹰) / AORUS (超级雕)    | 猎鹰/魔鹰性价比不错，购买时选择正规授权店铺即可                   |\n| **蓝宝石 Sapphire** (A卡)   | Pulse (脉冲星)                 | NITRO+ (超白金)                    | A 卡首选品牌之一，脉冲星性价比极高，超白金做工顶级                 |\n| **讯景 XFX 或撼讯** (A卡)     | SWFT (核心力量) / Fighter       | MERC (磁吸) / Hellhound (红魔)      | SWFT/Fighter 价格实惠；磁吸/红魔堆料足，散热强劲            |\n\n### 硬盘（HDD/SSD）\n（本篇知识也较多，感觉较为难懂的读者只把注意事项和品牌记住也勉强够用）\n\n又到了一个最近死贵的硬件了，还记得之前的内存条中提到的 “16+512” 的例子吗，其中的 512GB 在电脑中就是归硬盘管的。用来存储数据，类似军营中存放武器的仓库。断电了其中的数据也不会消失（严格来说，不论是固态还是机械，很长时间不通电数据依然会丢失，所以假如一个硬盘中存储着重要数据记得每个季度拿出来通电一次）\n\n硬盘分为两种，机械硬盘（hard disk drive，即常说的HDD）内部有高速旋转的金属/玻璃盘片（涂有磁性介质）和极其精密的磁头。抗震性差，噪音和功耗大，数据可恢复性较强，容量大，价格低，速度慢。      \n\n固态硬盘（solid state drive，即常说的SSD）内部没有任何物理机械运动部件，主要由主控芯片和闪存芯片组成。抗震性强，噪音和功耗小，数据恢复难度极高、成本昂贵，且一旦主控或闪存损坏，恢复可能性远低于机械硬盘，容量和价格方面，SSD仍高于HDD，但差距已显著缩小，且固态硬盘速度较快。        \n\n\n![[HDD.jpg|282]] ![[SSD.jpg|312]]\n<small>左图来源：Wikimedia Commons 作者：Evan-Amos (Vanamo Media)\n右图来源：Unsplash License，作者：Andrey Matveev（三星 980 PRO 系列 NVMe M.2 固态硬盘）<\/small>\n\n\n\n若预算高直接全上固态即可，但若预算很低，可以考虑采用固态 + 机械的思路，各取所长。     \n\n（事先声明，硬盘知识非常繁多，在此仅做简单介绍，若感觉笔者推荐不合你心，可以选择额外了解相关知识后再选择，这里只推荐笔者认为适用于大部分人的。）              \n\n首先机械硬盘使用场景大多为企业冷数据（即那些访问频率低但是需要保留的数据）存储，因为他们这些数据不用频繁调用，机械硬盘的低成本优势就显露出来了，NAS（私人云盘）同理。       \n\n机械硬盘大多被分为两种，CMR（垂直磁记录）和 SMR（叠瓦磁记录），两种各有优缺点，但笔者强烈推荐大家购买 CMR（垂直式）        \n\n| **对比维度**           | **CMR (垂直磁记录)**      | **SMR (叠瓦磁记录)**         |\n| ------------------ | -------------------- | ----------------------- |\n| **磁道排列方式**         | 平行排列，互不干扰            | 重叠排列（像屋顶瓦片）             |\n| **持续写入速度**         | **稳定**（150–250 MB/s） | **极不稳定**（缓存用尽后跌至几 MB/s） |\n| **响应延迟**           | 极低                   | 遇重写时响应时间极长，易引发软件卡死      |\n| **NAS / RAID 兼容性** | **完美支持**             | **坚决禁用**                |\n| **适合场景**           | 高频下载、NAS、工作资料、频繁改写   | 低频纯读取、一次性写入的冷数据备份       |\n\n买固态时，常常会看到“M.2”、“NVMe”、“SATA”、“PCIe 4.0”等名词，笔者在此处粗浅的用一张表格进行说明：          \n\n| **维度**                 | **常见规格 / 名称**                                     | **通俗解释与选择建议**                                                                                   |\n| ---------------------- | ------------------------------------------------- | ----------------------------------------------------------------------------------------------- |\n| **物理形态 (Form Factor)** | **M.2 (2280)** _(主流)_<br><br>  <br>**2.5 寸 SATA** | • **M.2**：像口香糖一样直接插在主板上，无需接线。<br><br>  <br><br>• **2.5寸**：像小黑盒，需要接电源线和数据线（老电脑升级用）。              |\n| **数据通道 (Bus)**         | **PCIe 通道** _(极速)_<br><br>  <br>**SATA 3.0 总线**   | • **PCIe**：高速公路，数据传输上限极高。<br><br>  <br><br>• **SATA**：普通马路，物理上限只有 600 MB/s。（实际使用一般550 MB/s 顶天了） |\n| **传输协议 (Protocol)**    | **NVMe 协议** _(高效)_<br><br><br>**AHCI 协议**         | • **NVMe**：专为固态硬盘高并发读写设计的现代协议。<br><br>  <br><br>• **AHCI**：老旧协议，专为传统机械硬盘设计。                     |\n\nPCle 类似之前讲的 DDR ，有多个版本迭代，PCle 4.0 就够用了，5.0 虽性能强悍但发热严重（预算上两万当我没说）不适合普通用户。（买 M.2 固态认准 PCIe 4.0 NVMe 协议，千万别买到披着 M.2 外皮的老旧 SATA 固态！！）      \n\n至于颗粒，具体不展开了，感兴趣可以搜索硬件茶谈进行深入学习，笔者建议优先选择TLC颗粒，QLC虽价格更低，但在写入寿命和缓外速度上有短板。 购买大厂货基本上不会踩雷~~（笔者朋友购买七彩虹硬盘就踩雷了）~~ \n\n| **品牌阵营**    | **代表品牌**                                              | **芯片与技术背景**             | **经典型号代表**                                             |\n| ----------- | ----------------------------------------------------- | ----------------------- | ------------------------------------------------------ |\n| **国产头部品牌**  | **致态 (Zhitai)**                                       | 长江存储（晶栈架构），TLC 颗粒品质极其顶尖 | TiPlus7100 (PCIe 4.0 无缓存性价比高) / TiPro7000 (带缓存旗舰)      |\n| **韩国半导体巨头** | **三星 (Samsung)**<br><br>  <br>**海力士 (SK hynix)**      | 自研主控+颗粒，性能巅峰，溢价略高       | 三星 990 Pro / 980 Pro<br><br>  <br><br>海力士 Platinum P41 |\n| **日本半导体厂**  | **铠侠 (Kioxia)**                                       | 原东芝存储，性价比高，品质稳定         | 铠侠 SD10 / G2                                           |\n| **美系大厂**    | **西部数据 (WD)**<br><br>  <br><br>**美光 / 英睿达 (Crucial)** | 拥有独立晶圆厂与主控研发能力          | 西数 SN770 / SN850X<br><br>  <br><br>英睿达 T500            |\n（固态硬盘尽量保留 10%~20% 的剩余空间，不要彻底填满，装机时记得撕膜，至于分盘等操作笔者会在  “[[03 哇，新电脑]]” 篇讲解）\n\n### 电源（PSU）\n\n给整台电脑供能，极其重要，功率不足或输出不稳定，配件再好也白瞎。作用是将家庭用的 220V 交流电，转化为电脑内部硬件所需的直流电输出。           \n\n**要注意额定功率而非峰值功率/瞬时功率**\n<center><small>（若预算有余，功率能高不低，毕竟电源耐用，更新配件也能继续用，笔者的公式较为保守，预算吃紧可以适当降低）<\/small><\/center>\n\n$$\\text{建议额定功率} = (\\text{CPU 极限功耗} + \\text{显卡极限功耗} + 150\\text{W 保留余量}) \\div 80\\%$$\n\n还要注意的有80 PLUS ，这是衡量电源将交流电转为直流电时的省电效率，也就是一个电源是否省电（这是因为转化过程中会有一部分变成热量散失）除非预算特别吃紧的话选择白牌或铜牌，不然建议选择金牌（富哥无脑白金或钛金）。但是需要注意的是， 80 PLUS 只能在一定程度上反应电源用料，不能完全代表用料。\n\n线材结构类型有非模组和全模组，区别如下（半模组不上不下的，不推荐，感兴趣者可自行学习）\n1. **非模组（直出）**：所有线材直接从电源内部伸出来，不能拆卸。多余的线砸在机箱底部，非常影响美观和走线。\n2. **全模组**：电源主体只有插孔，所有线材按需插拔。好走线、方便更换定制线，是中高端装机的主流。\n\nATX是一种规范标准，ATX 3.0/3.1规范提升了瞬态响应能力和新显卡接口支持。若搭配高端新显卡，建议优先选择ATX 3.0/3.1认证电源；但合格的ATX 2.x电源在功率余量充足时仍可正常使用。       \n\n<center>电源铭牌（这张图展示的是曜越钢影 GF1 850W电源）<\/center>\n\n![[PSU.jpg#pic_center|347]]\n解释一下电源铭牌哪些数据值得看，以及对应的意思，交流输入电压指的是电源能接受的电压，如图展示的叫宽幅电源，既可以广泛适应不同国家的电压，也可以有效接受城市用电高峰时电压不足220V的情况。        \n\n再次要注意额定输出功率，在这张图表格最下方（并不是叫 XX电源850 额定功率就一定是 850W，这只是一个名字，要防止商家耍小心思）直流输入最重要的前面三个，前面三个最重要的又是 +12V 那一列，一般来说这一列都是非常接近总的额定功率，这是因为这是负责 CPU 和 GPU 供电。（若有部分电源为两个 +12V 供电，预算不吃紧不建议选择，单路电源永远是第一选择）倘若铭牌没有具体书写功率，请使用 电压 * 电流 进行功率的计算。\n\n#### 注意事项：\n\n<mark style=\"background:#fff88f\"><font color=\"#ff0000\">严禁显卡热插拔<\/font><\/mark>（指在电脑通电开机的状态下，直接拔出或插入硬件），热插拔会导致显卡直接报废\n\n<mark style=\"background:#fff88f\"><font color=\"#ff0000\">不要混用模组线<\/font><\/mark>，否则跳闸甚至整机报废都有可能，哪怕同品牌不同型号也不要混用！！！！     \n\n认准一线品牌，电源是电脑的心脏，千万不能将就！！！！\n\n\n### 作业：\n\n能否按照图片回忆出电脑各个配件功能和注意点。（图片由Gemini生成）\n![[yingjianzuoye.png]]\n\n---\n\n**下一章：** [[02 你该知道的电脑认知]]\n\n","content/计算机入门指南/基础入门/02 你该知道的电脑认知.md":"（本篇以科普为主，帮你更好理解后续一些操作）\n\n### 商家为什么“骗人”\n\n读者应该从小听过 $1GB=1024MB$ 这种换算。但是当你兴致冲冲买了 1 TB 固态后，发现电脑上显示 931 GB ，一怒之下找人机客服反应，人机客服只会阿巴阿巴，没关系，人机不告诉你的笔者告诉你，其实这是正常的，这是因为二者换算制度不一样。                      \n\n厂商换算时是使用十进制，即 $1MB=1000KB，1GB=1000MB，1TB=1000GB$ ，而操作系统使用的是二进制，他们之间的互相转化比为 $2^{10}$ ，也就是读者熟知的 1024 的转化倍率（其实这种情况下对应的叫GiB，只是显示时简化为GB）。故读者所买的 1 TB 硬盘实际容量为 $10^{12}B$ ，在操作系统中就会显示 $10^{12}\\div 1024\\div 1024\\div 1024 \\approx 931.3GB$ 。\n\n> [!info]- 点击展开：关于存储单位的历史\n>早期计算机高度依赖二进制，因此单位转化采用接近十进制的 $2^{10}（1024）$ ，而且由于早期计算机硬盘空间较小，KB，MB级差别不大，因此无人在意。          \n>\n>随着个人电脑（PC）普及，硬盘容量从 MB 迈入 GB 级别。为了与内存计算方式保持一致，并沿用早期操作系统的软件管理习惯，Windows 等系统继续坚持 1024 的单位转换。但是硬盘厂商为了生产制造方便（毕竟物理世界并没有天然二进制属性），厂商严格遵循国际单位制。导致那段时间消费者买回家 100 GB 的硬盘，在 Windows 里显示只有约 93.1 GB，这种混乱引发了长期的‘缩水’质疑，甚至在 2000 年代初引发了针对硬盘厂商的多起消费者集体诉讼。             \n>\n>1998年，为了解决这一混乱现象，国际电工委员会（IEC）正式批准了 IEC 60027-2 修正案。提出了二进制转化时的单位为 GiB 等，随后 IEEE（电气电子工程师学会），CIPM（国际计量委员会），ISO（国际标准化组织）先后跟进了这一标准。              \n>\n>现在 Apple 公司的 macOS 系统在显示文件和硬盘容量时，已全面转化为 1000 进制。大部分 Linux 发行版（如 Ubuntu）和开源软件严格遵守标准。如果系统显示二进制（1024 进位），会明确写出 GiB ，反之写 GB。Windows 持续将错就错，以 GB 形式展示 ~~（我说Windows纯懒狗有没有人懂得）~~  \n\n","content/计算机入门指南/基础入门/03 哇，新电脑.md":"empty","content/计算机入门指南/基础入门/index.md":"<h2>基础入门<\/h2>\n本篇主要介绍一些电脑的基础，如组成，系统等，可能对你使用电脑没有显著帮助，但笔者希望大家耐心看完前几篇，对电脑有一个较为基础完善的认识。后面笔者再会讲常用软件，和良好电脑操作习惯 ~~（这位先生，你也不想你的电脑C盘被文件狠狠塞满吧）~~ 。为读者使用电脑打下良好基础。    \n\n若你只想学习基础操作，即常说的 “会用电脑” 的水平，笔者认为这一篇章完全足够了。\n\n**下一章** [[01 硬件相关知识]]\n\n","content/随笔/01.md":"\nThere is nothing.\n\n\n\n","content/随笔/index.md":"<h1>随笔<\/h1>\n\n网上常说，少年意气是不可再生之物。\n\n我很喜欢《金缕衣》里的那句：“花开堪折直须折，莫待无花空折枝。” 所谓的“折花”，大概就是把那些转瞬即逝的灵感、情绪、甚至偶尔的废话，用文字记录下来。\n\n记性不好，所以想用写作和遗忘抗衡一下。趁还年轻，趁还能被生活打动，在这个角落，留下点痕迹。"};</script>

.bg-image{position:absolute;width:100%;height:100%;object-fit:cover;opacity:0}
.bg-blur-overlay{position:fixed;inset:0;z-index:-2;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.bg-edge-overlay{position:fixed;inset:0;z-index:-1;pointer-events:none;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);background:var(--edge-blur-color)}
.bg-edge-overlay.home{background:rgba(255,255,255,.55)}
[data-theme="dark"] .bg-edge-overlay.home{background:rgba(0,0,0,.55)}
.sidebar,.main-header,.menu-dropdown,.content-wrapper{background:var(--content-bg)}
.content-wrapper.transparent{background:transparent}
.sidebar{background:var(--sidebar-content-bg)}
.main-header{background:var(--header-content-bg)}
.menu-dropdown{background:var(--sidebar-content-bg)}
.search-box{background:var(--content-bg)}
.overlay{display:none;position:fixed;inset:0;background:var(--overlay-bg);z-index:50}
.overlay.show{display:block}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;color:var(--text);height:calc(var(--vh,1vh)*100);height:100dvh;display:flex;overflow:hidden;position:relative}
.sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);height:calc(var(--vh,1vh)*100);height:100dvh;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;z-index:100;transition:width .35s ease,min-width .35s ease,border-color .35s ease}
@media(min-width:769px){.sidebar.hidden{width:0;min-width:0;border-right-color:transparent;overflow:hidden}}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border);cursor:pointer}
.sidebar-header h1{font-size:20px;font-weight:700;color:var(--accent)}
.sidebar-header p{font-size:12px;color:var(--text-secondary);margin-top:4px}
.search-box{margin:12px 16px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:var(--font-sidebar);outline:none;transition:border-color .2s;color:var(--text)}
.search-box:focus{border-color:var(--accent)}
.search-box::placeholder{color:var(--text-secondary)}
.tree-wrapper{flex:1;overflow-y:auto;padding:8px 0}
.tree-wrapper::-webkit-scrollbar{width:6px}
.tree-wrapper::-webkit-scrollbar-thumb{background:var(--text-secondary);border-radius:3px}
.tree-item{cursor:pointer;user-select:none}
.tree-item-inner{display:flex;align-items:center;gap:6px;padding:6px 16px;font-size:var(--font-sidebar);color:var(--text);transition:background .15s}
.tree-item-inner:hover{background:var(--hover)}
.tree-item-inner.active{background:var(--active);color:var(--accent);font-weight:600}
.tree-icon{width:16px;text-align:center;flex-shrink:0;font-size:12px;color:var(--text-secondary)}
.tree-arrow{width:16px;flex-shrink:0;transition:transform .2s;font-size:10px;color:var(--text-secondary)}
.tree-arrow.open{transform:rotate(90deg)}
.tree-children{display:none}
.tree-children.open{display:block}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-header{display:flex;align-items:center;padding:8px 20px;border-bottom:1px solid var(--border);gap:8px;min-height:52px}
/* ─── 侧栏切换按钮（仅桌面端） ─── */
.sidebar-toggle{display:flex;background:none;border:none;font-size:14px;cursor:pointer;padding:4px 8px;color:var(--text);border-radius:4px;align-items:center;justify-content:center;width:28px;transition:transform .3s ease}
.sidebar-toggle:hover{background:var(--hover)}
@media(max-width:768px){.sidebar-toggle{display:none}}

.hamburger{display:none;background:none;border:none;font-size:20px;cursor:pointer;padding:4px 8px;color:var(--text);border-radius:4px}
.hamburger:hover{background:var(--hover)}
.desktop-title{font-size:var(--font-title);font-weight:600;color:var(--accent);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.header-btn{background:none;border:1px solid var(--border);font-size:18px;cursor:pointer;padding:6px 10px;color:var(--text);border-radius:6px;transition:all .2s;line-height:1;display:flex;align-items:center;justify-content:center}
.header-btn:hover{background:var(--hover);border-color:var(--accent)}
.menu-dropdown{position:fixed;right:20px;top:52px;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:8px 12px;min-width:220px;z-index:200;display:none}
.menu-dropdown.open{display:block}
.menu-section{padding:4px 4px 6px;font-size:11px;font-weight:600;color:var(--text-secondary);letter-spacing:1px;text-transform:uppercase}
.bg-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 0 8px 0}
.bg-grid-item{text-align:center;padding:8px 4px;font-size:13px;color:var(--text);cursor:pointer;border-radius:6px;transition:all .2s;background:var(--bg);border:1px solid var(--border)}
.bg-grid-item:hover{background:var(--hover);border-color:var(--accent)}
.bg-grid-item.active{background:var(--active);color:var(--accent);font-weight:600;border-color:var(--accent)}
.font-row{display:flex;gap:6px;padding:8px 0 4px}
.font-item{flex:1;text-align:center;padding:8px 4px;font-size:13px;color:var(--text);cursor:pointer;border-radius:6px;transition:all .2s;background:var(--bg);border:1px solid var(--border)}
.font-item:hover{background:var(--hover);border-color:var(--accent)}
.font-item.active{background:var(--active);color:var(--accent);font-weight:600;border-color:var(--accent)}
.menu-divider{border:none;border-top:1px solid var(--border);margin:4px 0}
.music-player{padding:4px 4px 8px}
.music-info{font-size:13px;color:var(--accent);font-weight:600;text-align:center;padding:6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-controls{display:flex;gap:6px;justify-content:center}
.music-btn{background:none;border:1px solid var(--border);font-size:18px;cursor:pointer;padding:6px 14px;color:var(--text);border-radius:6px;transition:all .2s;line-height:1}
.music-btn:hover{background:var(--hover);border-color:var(--accent)}
.music-btn.playing{background:var(--active);border-color:var(--accent)}
.music-btn.loading{position:relative;pointer-events:none;opacity:.7}
.music-btn .spinner{display:none;width:18px;height:18px;border:2px solid var(--border);border-top:2px solid var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
.music-btn.loading .spinner{display:block}
.music-btn.loading .btn-icon{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
#giscus-container{position:relative;width:100%}
.volume-row{padding:6px 2px 0;display:flex;align-items:center;gap:8px}
.volume-slider{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--border);outline:none;cursor:pointer}
.volume-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;transition:transform .15s}
.volume-slider::-webkit-slider-thumb:hover{transform:scale(1.2)}
.volume-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:none;cursor:pointer}
.content-wrapper{flex:1;overflow-y:auto;padding:40px;max-width:860px;width:100%;margin:0 auto;transition:max-width .35s ease}
.content-wrapper::-webkit-scrollbar{width:8px}
.content-wrapper::-webkit-scrollbar-thumb{background:var(--text-secondary);border-radius:4px}
.markdown-body{line-height:1.8;font-size:var(--font-md-body);color:var(--text)}
.markdown-body h1{font-size:var(--font-md-h1);font-weight:700;margin-bottom:24px;padding-bottom:12px;border-bottom:2px solid var(--border)}
.markdown-body h2{font-size:var(--font-md-h2);font-weight:600;margin:28px 0 12px}
.markdown-body h3{font-size:var(--font-md-h3);font-weight:600;margin:24px 0 8px}
.markdown-body p{margin:12px 0}
.markdown-body ul,.markdown-body ol{margin:8px 0;padding-left:24px}
.markdown-body li{margin:4px 0}
.markdown-body code{background:var(--code-bg);padding:2px 6px;border-radius:4px;font-size:calc(var(--font-md-body) - 2px);font-family:"Fira Code","Consolas",monospace;color:var(--text)}
.markdown-body pre{background:var(--code-bg);padding:16px;border-radius:8px;overflow-x:auto;margin:16px 0}
.markdown-body pre code{background:none;padding:0;font-size:calc(var(--font-md-body) - 2px)}
.markdown-body blockquote{border-left:4px solid var(--accent);padding:8px 16px;margin:16px 0;background:var(--blockquote-bg);color:var(--text-secondary)}
.markdown-body img{max-width:100%;border-radius:8px;margin:16px 0;box-shadow:var(--img-shadow)}
.markdown-body a{color:var(--accent);text-decoration:none}
.markdown-body a:hover{text-decoration:underline}
.markdown-body hr{border:none;border-top:1px solid var(--border);margin:24px 0}
.markdown-body table{width:100%;border-collapse:collapse;margin:16px 0}
.markdown-body th,.markdown-body td{border:1px solid var(--border);padding:8px 12px;text-align:left}
.markdown-body th{background:var(--hover);font-weight:600}
.markdown-body strong{font-weight:700}
.markdown-body .home-wrapper{max-width:720px;margin:0 auto;padding:10px 0}
.markdown-body .home-header{text-align:center;padding:20px 0 12px}
.markdown-body .site-title{font-size:var(--font-md-h1);font-weight:700;color:var(--accent);margin-bottom:8px}
.markdown-body .random-quote{font-size:15px;color:var(--text-secondary);font-style:italic;margin:4px 0}
.markdown-body .author-words p{font-size:var(--font-md-body);color:var(--text);line-height:1.9;margin:0;text-align:center}
.markdown-body .friend-link{text-align:center;margin-top:24px;font-size:14px;color:var(--text-secondary)}
.markdown-body .card-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin:20px 0 0;padding:0}
.markdown-body .glass-card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 16px;border-radius:12px;background:var(--sidebar-content-bg);border:1px solid var(--border);text-decoration:none !important;color:var(--text) !important;transition:all .25s ease;cursor:pointer;margin:0;box-sizing:border-box}
.markdown-body .glass-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent);background:var(--active);text-decoration:none !important}
.markdown-body .glass-card .card-icon{font-size:32px;margin-bottom:10px}
.markdown-body .glass-card .card-title{font-size:16px;font-weight:600;color:var(--accent);margin-bottom:6px}
.markdown-body .glass-card .card-desc{font-size:13px;color:var(--text-secondary);line-height:1.5;margin:0 0 8px}
.markdown-body .glass-card .card-preview{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.markdown-body .glass-card .card-preview-item{font-size:12px;padding:2px 8px;border-radius:4px;background:var(--bg);color:var(--text-secondary);white-space:nowrap}
.markdown-body .shelf-wrapper{max-width:600px;margin:0 auto;padding:20px 0}
.markdown-body .shelf-header h2{font-size:var(--font-md-h2);font-weight:600;margin-bottom:24px;color:var(--text);text-align:center}
.markdown-body .shelf-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin:0;padding:0}
.markdown-body .shelf-card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 16px;border-radius:12px;background:var(--sidebar-content-bg);border:1px solid var(--border);text-decoration:none !important;color:var(--text) !important;transition:all .25s ease;cursor:pointer;margin:0;box-sizing:border-box}
.markdown-body .shelf-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent);background:var(--active);text-decoration:none !important}
.markdown-body .shelf-card .shelf-icon{font-size:36px;margin-bottom:12px}
.markdown-body .shelf-card .shelf-title{font-size:16px;font-weight:600;color:var(--accent);margin-bottom:6px}
.markdown-body .shelf-card .shelf-desc{font-size:13px;color:var(--text-secondary);line-height:1.5;margin:0}
@media(max-width:768px){
.markdown-body .card-grid,.markdown-body .shelf-grid{grid-template-columns:1fr;gap:12px}
.markdown-body .glass-card,.markdown-body .shelf-card{padding:16px 14px;flex-direction:row;gap:14px;text-align:left}
.markdown-body .glass-card .card-icon,.markdown-body .shelf-card .shelf-icon{font-size:26px;margin-bottom:0}
.markdown-body .glass-card .card-preview{justify-content:flex-start}
}
/* ─── 回到顶部按钮 ─── */
.top-btn{position:absolute;bottom:24px;right:24px;width:42px;height:42px;border-radius:50%;background:var(--bg);color:var(--text-secondary);font-size:18px;font-weight:700;line-height:42px;text-align:center;cursor:pointer;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease,background .25s ease,color .25s ease;user-select:none;touch-action:none;border:1px solid var(--border)}
.top-btn.show{opacity:1;pointer-events:auto}
.top-btn:hover{transform:scale(1.1);background:var(--hover);color:var(--accent)}
@media(max-width:768px){.top-btn{bottom:16px;right:16px;width:38px;height:38px;font-size:16px;line-height:38px}}

/* ─── Obsidian 语法样式 ─── */
.obsidian-callout{border-left:4px solid;border-radius:4px;padding:10px 14px;margin:12px 0;background:var(--blockquote-bg)}
.obsidian-callout>div:first-child{font-weight:600;margin-bottom:4px}
.obsidian-callout ol,.obsidian-callout ul{margin:4px 0;padding-left:20px}
.obsidian-callout p{margin:4px 0}
.obsidian-task{display:flex;align-items:flex-start;gap:8px;margin:6px 0;cursor:default;color:var(--text)}
.obsidian-task input[type="checkbox"]{margin-top:4px;accent-color:var(--accent);width:15px;height:15px;flex-shrink:0}
.obsidian-task input[type="checkbox"]:checked+span{text-decoration:line-through;color:var(--text-secondary)}
.markdown-body mark{background:rgba(255,213,0,.4);color:inherit;padding:1px 3px;border-radius:3px}
[data-theme="dark"] .markdown-body mark{background:rgba(255,213,0,.25);color:#e0e0e0}
.obsidian-wikilink-missing{color:#f44336;font-style:normal;padding:0 2px;border-bottom:1px dashed #f44336;cursor:help}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-secondary)}
.empty-state h2{font-size:24px;margin-bottom:8px}.empty-state p{font-size:14px}
@media(max-width:768px){
.hamburger{display:block}
.main-header{padding:8px 12px}
.sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:var(--shadow);transition:transform .3s ease}
.sidebar.open{transform:translateX(0)}
.content-wrapper{padding:20px 16px}
.markdown-body{font-size:var(--font-md-body)}
.markdown-body h1{font-size:var(--font-md-h1)}
.markdown-body h2{font-size:var(--font-md-h2)}
.markdown-body h3{font-size:var(--font-md-h3)}
.desktop-title{display:none}
.header-actions{margin-left:auto}
.menu-dropdown{right:12px}
}
</style>
</head>
<body>
<div class="bg-layer" id="bgLayer">
  <video class="bg-video" id="bgVideo" muted loop playsinline preload="auto"></video>
  <img class="bg-image" id="bgImage" alt="" style="display:none">
</div>
<div class="bg-edge-overlay"></div>

<audio id="bgAudio" preload="auto" style="display:none" src></audio>

<div class="overlay" id="overlay"></div>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header" id="sidebarHeader">
    <h1>安巢鸟的小站</h1>
    <p>HomewardBird's Site</p>
  </div>
  <input class="search-box" id="searchBox" type="text" placeholder="搜索文章..." oninput="filterTree(this.value)">
  <div class="tree-wrapper" id="treeWrapper"></div>
</nav>

<div class="main">
  <div class="main-header">
    <button class="hamburger" id="hamburgerBtn">☰</button>
    <button class="sidebar-toggle" id="sidebarToggle" title="切换侧栏">⇐</button>
    <span class="desktop-title" id="desktopTitle">安巢鸟的小站</span>
    <span id="mobileTitle" style="font-size:15px;font-weight:600;color:var(--text);display:none;">安巢鸟的小站</span>
    <div class="header-actions">
      <button class="header-btn" id="themeToggle" title="切换深浅色模式">🌙</button>
      <button class="header-btn" id="menuBtn" title="菜单">⚙️</button>
    </div>
  </div>
  <div class="menu-dropdown" id="menuDropdown">
    <div class="menu-section">背景</div>
    <div class="bg-grid">
      <div class="bg-grid-item active" data-bg-option="video">🎬 视频</div>
      <div class="bg-grid-item" data-bg-option="neutral">⬜ 中性</div>
      <div class="bg-grid-item" data-bg-option="warm">🟨 暖色</div>
      <div class="bg-grid-item" data-bg-option="cool">🟦 冷色</div>
    </div>
    <hr class="menu-divider">
    <div class="menu-section">字体</div>
    <div class="font-row">
      <div class="font-item" data-font-option="small">A⁻ 小字</div>
      <div class="font-item active" data-font-option="default">A 默认</div>
      <div class="font-item" data-font-option="large">A⁺ 大字</div>
    </div>
    <hr class="menu-divider">
    <div class="menu-section">音乐</div>
    <div class="music-player" id="musicPlayer">
      <div class="music-info" id="musicTitle">未播放</div>
      <div class="music-controls">
        <button class="music-btn" id="musicPrev" title="上一首">⏮</button>
        <button class="music-btn" id="musicToggle" title="播放/暂停"><span class="spinner"></span><span class="btn-icon">▶️</span></button>
        <button class="music-btn" id="musicNext" title="下一首">⏭</button>
      </div>
      <div class="volume-row">
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
      </div>
    </div>
  </div>
  <div class="content-wrapper" id="contentWrapper">
    <div class="top-btn" id="topBtn" title="回到顶部">▲</div>
    <div class="empty-state" id="emptyState">
      <h2>👋 欢迎</h2>
      <p>从左侧目录选择一篇文章开始阅读</p>
    </div>
    <div class="markdown-body" id="markdownBody" style="display:none;"></div>
    <div id="giscus-container" style="display:none;margin-top:32px"></div>
  </div>
</div>

<script>
// ─── 深浅色模式 ───
(function() {
  var s = localStorage.getItem('theme');
  if (s === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else if (!s && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
})();
function toggleTheme() {
  var h = document.documentElement;
  var isDark = h.getAttribute('data-theme') === 'dark';
  if (isDark) { h.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); document.getElementById('themeToggle').textContent = '🌙'; }
  else { h.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); document.getElementById('themeToggle').textContent = '☀️'; }
  updateBackground();
  // 同步 Giscus 深浅色
  var newTheme = isDark ? 'light' : 'dark';
  var gFrame = document.querySelector('iframe.giscus-frame');
  if (gFrame) {
    gFrame.contentWindow.postMessage({ giscus: { setConfig: { theme: newTheme } } }, 'https://giscus.app');
  }
}
document.getElementById('themeToggle').addEventListener('click', toggleTheme);
(function() { document.getElementById('themeToggle').textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙'; })();

// ─── 背景 ───
function getBgOption(){return localStorage.getItem('bgOption')||'video'}
function setBgOption(opt){
  localStorage.setItem('bgOption',opt);
  document.documentElement.setAttribute('data-bg',opt==='video'?'':opt);
  document.querySelectorAll('.bg-grid-item').forEach(function(el){el.classList.toggle('active',el.dataset.bgOption===opt)});
  updateBackground();
  // 切换背景时同步主页遮罩
  var cw=document.getElementById('contentWrapper'),eo=document.querySelector('.bg-edge-overlay');
  if(cw&&cw.classList.contains('transparent')){
    if(opt==='video'&&eo)eo.classList.add('home');
    else if(eo)eo.classList.remove('home');
  }
}
function updateBackground(){
  var opt=getBgOption(),isDark=document.documentElement.getAttribute('data-theme')==='dark',isM=window.innerWidth<=768,v=document.getElementById('bgVideo'),i=document.getElementById('bgImage');
  if(v.style.display!=='none')v.style.opacity='0';
  if(i.style.display!=='none')i.style.opacity='0';
  setTimeout(function(){
    if(opt==='video'){
      if(isM){v.style.display='none';i.src=isDark?'/static/bgv/dark_bg.jpg':'/static/bgv/light_bg.jpg';i.style.display='block';i.onload=function(){requestAnimationFrame(function(){i.style.opacity='1'})};if(i.complete)requestAnimationFrame(function(){i.style.opacity='1'})}
      else{i.style.display='none';v.style.opacity='0';v.src=isDark?'/static/bgv/dark_bg.mp4':'/static/bgv/light_bg.mp4';v.style.display='block';v.onloadeddata=function(){requestAnimationFrame(function(){v.style.opacity='1'});v.play().catch(function(){})};if(v.readyState>=2){requestAnimationFrame(function(){v.style.opacity='1'});v.play().catch(function(){})}}
    }else{v.style.display='none';i.style.display='none'}
  },300);
}
(function(){
  document.querySelectorAll('.bg-grid-item').forEach(function(el){el.classList.remove('active')});
  var b=localStorage.getItem('bgOption');
  if(b&&b!=='video'){document.documentElement.setAttribute('data-bg',b);document.querySelectorAll('.bg-grid-item').forEach(function(el){if(el.dataset.bgOption===b)el.classList.add('active')})}
  else document.querySelectorAll('.bg-grid-item').forEach(function(el){if(el.dataset.bgOption==='video')el.classList.add('active')});
  updateBackground();
})();

// ─── ⭐ SPA 导航（音乐不中断的关键） ───
function navigateTo(url) {
  // 从 URL 推导出对应的 fileKey
  // /index.html → content/index.md
  // /关于.html → content/关于.md
  // /杂谈/01 网名的故事.html → content/杂谈/01 网名的故事.md
  // /杂谈/ → content/杂谈/index.md
  var fileKey = decodeURIComponent(url.replace(/^\//, ''));
  if (fileKey === '' || fileKey === 'index.html') { fileKey = 'content/index.md'; }
  else { fileKey = 'content/' + fileKey.replace(/\/$/, '/index').replace(/\.html$/, '') + '.md'; }

  // 检查该文章是否存在内容
  var md = contentMap[fileKey];
  if (!md) { window.location.href = url; return; } // 回退到正常导航

  // 更新 URL（不刷新页面）
  history.pushState({ fileKey: fileKey }, '', url);

  // 更新侧栏高亮和展开
  document.querySelectorAll('.tree-item-inner.active').forEach(function(el){el.classList.remove('active')});
  document.querySelectorAll('.tree-item .tree-arrow.open').forEach(function(el){el.classList.remove('open')});
  document.querySelectorAll('.tree-item .tree-children.open').forEach(function(el){el.classList.remove('open')});
  var el = document.querySelector('[data-path="'+fileKey+'"]');
  if (el) el.classList.add('active');

  // 展开祖先文件夹
  var parts = fileKey.split('/'); var dirs = parts.slice(1, -1);
  document.querySelectorAll('.tree-item').forEach(function(item){
    var inner = item.querySelector('.tree-item-inner'); if(!inner)return;
    var arrow=inner.querySelector('.tree-arrow'); if(!arrow)return;
    var name=inner.querySelector('span:last-child').textContent;
    for(var j=0;j<dirs.length;j++){if(dirs[j]===name){arrow.classList.add('open');var ch=item.querySelector('.tree-children');if(ch)ch.classList.add('open');break}}
  });

  // 加载文章
  loadFile(fileKey, el);

  // 刷新 Giscus 评论（按当前 URL 路径加载对应讨论）
  var gFrame = document.querySelector('iframe.giscus-frame');
  if (gFrame) {
    gFrame.contentWindow.postMessage({
      giscus: { setConfig: { term: window.location.pathname } }
    }, 'https://giscus.app');
  }

  // 更新标题
  var label = '安巢鸟的小站';
  if (fileKey !== 'content/index.md') {
    var n = fileKey.replace(/^content\//,'').replace(/\.md$/,'').replace(/\/index$/,'');
    label = n + ' - 安巢鸟的小站';
  }
  document.title = label;
}

function getArticleUrl(filePath) {
  var url = filePath.replace(/^content\//,'').replace(/\/index\.md$/,'/index.html').replace(/\.md$/,'.html');
  return '/' + url;
}

// 按 Obsidian 规则解析 Wiki 链接：支持文件名短名（任意目录下的同名 .md / 文件夹 index 页）
function wikiResolve(page) {
  var direct = 'content/' + page + '.md';
  if (contentMap[direct]) return direct;
  var folderIndex = 'content/' + page + '/index.md';
  if (contentMap[folderIndex]) return folderIndex;
  // Obsidian 短名：在整个目录树中按“文件名”匹配（同名文件不唯一时不猜测）
  var keys = Object.keys(contentMap);
  var found = null, count = 0;
  for (var i = 0; i < keys.length; i++) {
    var segs = keys[i].split('/');
    var last = segs[segs.length - 1];
    var isMatch = (last === page + '.md') ||
                  (last === 'index.md' && segs.length >= 2 && segs[segs.length - 2] === page);
    if (isMatch) { count++; found = keys[i]; }
  }
  return count === 1 ? found : null;
}

function renderTree(nodes,container,depth,parentPath){
  if(depth===undefined)depth=0;
  if(parentPath===undefined)parentPath='';
  nodes.forEach(function(node){
    if(node.type==='folder'&&node.name==='images')return;
    var item=document.createElement('div');item.className='tree-item';
    if(node.type==='folder'){
      var folderPath=parentPath+'/'+encodeURIComponent(node.name);
      var inner=document.createElement('div');inner.className='tree-item-inner tree-item-inner-folder';inner.style.paddingLeft=(16+depth*16)+'px';
      inner.innerHTML='<span class="tree-arrow">▶</span><span class="tree-icon">📁</span><span>'+esc(node.name)+'</span>';
      var arrow=inner.querySelector('.tree-arrow');
      arrow.addEventListener('click',function(e){e.stopPropagation();this.classList.toggle('open');item.querySelector('.tree-children').classList.toggle('open')});
      inner.addEventListener('click',function(e){e.stopPropagation();navigateTo(folderPath+'/index.html')});
      item.appendChild(inner);
      var ch=document.createElement('div');ch.className='tree-children';renderTree(node.children||[],ch,depth+1,folderPath);item.appendChild(ch);
    } else {
      var inner=document.createElement('div');inner.className='tree-item-inner';
      var label=node.label==='index'?(node.path.split('/').slice(-2,-1)[0]||'首页'):node.label;
      inner.style.paddingLeft=(16+depth*16)+'px';
      inner.innerHTML='<span class="tree-icon">'+getIcon(node.path)+'</span><span>'+esc(label)+'</span>';
      inner.dataset.path=node.path;
      inner.addEventListener('click',function(e){e.preventDefault();navigateTo(getArticleUrl(node.path))});
      item.appendChild(inner);
    }
    container.appendChild(item);
  });
}
function getIcon(p){var n=p.split('/').pop();if(n==='关于.md')return'ℹ️';if(n==='留言.md')return'💬';if(n==='个人博客.md')return'📰';if(n==='index.md')return'🏠';return'📄'}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}

function loadFile(path,element){
  document.querySelectorAll('.tree-item-inner.active').forEach(function(el){el.classList.remove('active')});
  if(element)element.classList.add('active');
  var mdText=contentMap[path];
  if(!mdText){document.getElementById('markdownBody').innerHTML='<p style="color:#d32f2f;">❌ 文章内容未找到</p>';return}
  // 主页正文透明 + 遮罩（仅视频模式），其他页面恢复
  var cw=document.getElementById('contentWrapper'),eo=document.querySelector('.bg-edge-overlay');
  if(path==='content/index.md'){cw.classList.add('transparent');if(eo&&getBgOption()==='video')eo.classList.add('home')}else{cw.classList.remove('transparent');if(eo)eo.classList.remove('home')}

  document.getElementById('emptyState').style.display='none';
  var mdBody=document.getElementById('markdownBody');mdBody.style.display='block';
  var basePath=path.lastIndexOf('/')!==-1?path.substring(0,path.lastIndexOf('/')):'content';

  // ═══ Obsidian 语法全面支持 ═══

  // 1. 删除 Obsidian 注释 %%...%%
  mdText = mdText.replace(/%%[\s\S]*?%%/g, '');

  // 2. 处理 Obsidian 图片语法 ![[filename.ext#hash|size]] → <img src="...">
  // 所有图片统一放在 content/images/ 目录下
  mdText = mdText.replace(/!\[\[([^\]|]+?)(?:#([^\]]*?))?(?:\|(\d+))?\]\]/g, function(m, fname, hash, size) {
    var res = '<img src="/content/images/' + fname + '"';
    if (size) res += ' width="' + size + '"';
    if (hash === 'pic_center') res += ' style="display:block;margin:0 auto"';
    res += '>';
    return res;
  });

  // 3. Callout 语法保留为标准 blockquote（marked 渲染后再 DOM 转换）
  // 这一步不需要替换——在 marked.parse 之后处理

  // 4. 预处理行内 Markdown 语法（在 marked 解析前转换为 HTML）
  //    解决 HTML 与 Markdown 混写时，语法被 HTML 块吞掉的问题
  //    顺序：**bold** → *italic*，避免 * 与 ** 冲突
  mdText = mdText.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  mdText = mdText.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  mdText = mdText.replace(/~~(.+?)~~/g, '<del>$1</del>');

  // 5. 处理高亮 ==text== → <mark>
  mdText = mdText.replace(/==([^=]+)==/g, '<mark>$1</mark>');

  // 6. 处理 Wiki 链接 [[页面]] / [[页面#标题]] / [[页面|别名]] → 内部链接
  //    Obsidian 按“文件名短名”解析：[[01 硬件相关知识]] 可指向任意目录下的同名文章
  mdText = mdText.replace(/\[\[([^\]|!]+?)(?:#([^\]|]+?))?(?:\|([^\]]+?))?\]\]/g, function(m, page, heading, alias) {
    var label = alias || (heading ? page + ' #' + heading : page);
    // 转成内容站点链接格式（contentMap 查找，支持 Obsidian 短名）
    var pageFile = wikiResolve(page);
    var url;
    if (pageFile) {
      url = getArticleUrl(pageFile) + (heading ? '#' + encodeURIComponent(heading) : '');
    } else {
      // 找不到页面，显示为文本
      return '<em class="obsidian-wikilink-missing">' + label + '</em>';
    }
    return '<a href="' + url + '">' + label + '</a>';
  });

  // 🚀 marked 配置（Obsidian 风格）
  marked.setOptions({
    breaks: true,             // 单换行 <br>
    gfm: true,                // GitHub 风格（表格/删除线/任务列表等）
    headerIds: true           // 标题锚点
  });

  // ⚡ 保护数学公式（防止 marked 转义 LaTeX 反斜杠）
  // 使用 @@MATH0@@ 占位符（不能用 \u0000，因为 HTML 解析器会丢弃空字符）
  var mathStore = [];
  mdText = mdText.replace(/\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\([^)]*\\\)|^[ \t]*\$[^\S\n]*\n[\s\S]*?\n[ \t]*\$(?=\r?\n|$)|\$[^$\n]+\$/gm, function(m){
    // 单 $ 独立成行的块级公式 → 规范化为 $$...$$，保证按块级（display）渲染
    if (!m.startsWith('$$') && /^\s*\$/.test(m) && /\$\s*$/.test(m) && /\n/.test(m)) {
      m = '$$' + m.slice(m.indexOf('\n'), m.lastIndexOf('\n') + 1) + '$$';
    }
    mathStore.push(m);
    return '@@MATH' + (mathStore.length - 1) + '@@';
  });

  // 渲染（图片 MD 语法也保留支持）
  mdBody.innerHTML=marked.parse(mdText.replace(/!\[([^\]]*)\]\(\.\/images\//g,'![$1]('+basePath+'/images/'));
  // 恢复被保护的数学公式（在 KaTeX 渲染前恢复）
  if (mathStore.length) {
    mdBody.innerHTML = mdBody.innerHTML.replace(/@@MATH(\d+)@@/g, function(m, idx){
      return mathStore[parseInt(idx)] || m;
    });
  }
  mdBody.querySelectorAll('img').forEach(function(img){img.style.cursor='zoom-in';img.addEventListener('click',function(){window.open(this.src,'_blank')})});

  // ─── Obsidian Callout → 彩色框（渲染后 DOM 转换，保留内部 Markdown） ───
  var colors = { note:'#1976d2', info:'#2196f3', tip:'#4caf50', success:'#4caf50', question:'#9c27b0', warning:'#ff9800', danger:'#f44336', caution:'#f44336', important:'#e91e63', bug:'#f44336', example:'#607d8b', quote:'#9e9e9e', abstract:'#03a9f4' };
  mdBody.querySelectorAll('blockquote').forEach(function(bq){
    var firstLine = bq.textContent.trim().split('\n')[0] || '';
    var m = firstLine.match(/^\[!(\w+)\](.*)$/);
    if (m) {
      var type = m[1].toLowerCase(), color = colors[type] || '#1976d2', title = (m[2]||'').trim() || type;
      // 去除第一行（[!xxx] 标题行）
      var bodyClone = bq.cloneNode(true);
      var firstChild = bodyClone.firstChild;
      while (firstChild && firstChild.nodeType === 1) { firstChild = firstChild.nextSibling; }
      if (firstChild) bodyClone.removeChild(firstChild);
      else {
        // 移除第一个子元素的第一行文本
        var firstEl = bodyClone.querySelector('p,h1,h2,h3,ul,ol,li');
        if (firstEl) {
          var texts = firstEl.childNodes;
          for (var i = texts.length - 1; i >= 0; i--) {
            if (texts[i].nodeType === 3 && texts[i].textContent.indexOf('[!' + m[1] + ']') !== -1) {
              firstEl.removeChild(texts[i]);
            }
          }
          if (!firstEl.textContent.trim()) firstEl.remove();
        }
      }
      bodyClone.innerHTML = bodyClone.innerHTML.replace(/(<[^>]*>)?\s*\[!(\w+)\]([^<]*)/, '$1');
      var div = document.createElement('div');
      div.className = 'obsidian-callout';
      div.style.borderLeft = '4px solid ' + color;
      div.style.background = 'var(--blockquote-bg)';
      var titleDiv = document.createElement('div');
      titleDiv.style.cssText = 'font-weight:600;color:' + color + ';margin-bottom:4px';
      titleDiv.textContent = title;
      div.appendChild(titleDiv);
      var contentDiv = document.createElement('div');
      while (bodyClone.firstChild) contentDiv.appendChild(bodyClone.firstChild);
      div.appendChild(contentDiv);
      bq.parentNode.replaceChild(div, bq);
    }
  });

  // ─── 任务列表美化 ───
  mdBody.querySelectorAll('li').forEach(function(li){
    var input = li.querySelector('input[type="checkbox"]');
    if (input) {
      var label = document.createElement('label');
      label.className = 'obsidian-task';
      label.appendChild(input);
      // 保留 li 中的文本内容（去掉 checkbox 之前的文本节点）
      var text = li.innerHTML.replace(/<input[^>]*>/, '');
      var span = document.createElement('span');
      span.innerHTML = text;
      label.appendChild(span);
      li.innerHTML = '';
      li.appendChild(label);
    }
  });

  // ─── Mermaid 流程图/时序图渲染 ───
  // 支持 ```mermaid 代码块 → SVG 图表
  if (window.mermaid) {
    try {
      mermaid.initialize({ startOnLoad: false, theme: (document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'default'), securityLevel: 'loose' });
      (function renderMermaid(){
        var blocks = mdBody.querySelectorAll('pre code.language-mermaid');
        if (!blocks.length) return;
        blocks.forEach(function(code, i){
          var diagramText = code.textContent;
          var div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = diagramText;
          var pre = code.closest('pre');
          if (pre) pre.parentNode.replaceChild(div, pre);
          else code.parentNode.replaceChild(div, code);
          mermaid.render('mermaid' + Date.now() + '_' + i, diagramText).then(function(result){
            div.innerHTML = result.svg;
          }).catch(function(err){
            div.innerHTML = '<p style="color:#f44336;">⚠️ Mermaid 渲染失败：' + err.message + '</p>';
          });
        });
      })();
    } catch(e) {}
  }

  // ─── KaTeX 数学公式渲染 ───
  // 支持 $...$ 行内公式、$$...$$ 块级公式（Obsidian/LaTeX 风格）
  if (window.renderMathInElement) {
    try {
      renderMathInElement(mdBody, {
        delimiters: [

function filterTree(q){
  var items=document.querySelectorAll('.tree-item'),query=q.toLowerCase().trim();
  document.querySelectorAll('.tree-children').forEach(function(e){e.classList.remove('open')});
  document.querySelectorAll('.tree-arrow').forEach(function(e){e.classList.remove('open')});
  if(!query){items.forEach(function(e){e.style.display=''});return}
  items.forEach(function(e){
    var t=e.textContent.toLowerCase();e.style.display=t.indexOf(query)!==-1?'':'none';
    if(t.indexOf(query)!==-1){var c=e.querySelector('.tree-children'),a=e.querySelector('.tree-arrow');if(c)c.classList.add('open');if(a)a.classList.add('open')}
  });
}


// ─── 桌面端侧栏切换（带滑动动画） ───
(function(){
  var sidebar=document.getElementById('sidebar'),toggle=document.getElementById('sidebarToggle'),main=document.querySelector('.main');
  function setSidebarState(hidden){
    var cw=document.getElementById('contentWrapper');
    if(hidden){
      sidebar.classList.add('hidden');
      cw.style.maxWidth='1200px';
      toggle.textContent='⇒';
      localStorage.setItem('sidebarHidden','true');
    }else{
      sidebar.classList.remove('hidden');
      cw.style.maxWidth='860px';
      toggle.textContent='⇐';
      localStorage.setItem('sidebarHidden','false');
    }
  }
  // 从 localStorage 恢复（仅桌面端）
  // 初始化主页遮罩（视频模式）
  (function(){
    var eo=document.querySelector('.bg-edge-overlay'),cw=document.getElementById('contentWrapper');
    if(cw.classList.contains('transparent')&&getBgOption()==='video'&&eo)eo.classList.add('home');
  })();
  // 非桌面端跳过侧栏隐藏恢复
  if(window.innerWidth>768&&localStorage.getItem('sidebarHidden')==='true') setSidebarState(true);
  toggle.addEventListener('click',function(){
    setSidebarState(sidebar.classList.contains('hidden')?false:true);
  });
  // 窗口尺寸变化时，移动端自动移除 hidden
  window.addEventListener('resize',function(){
    if(window.innerWidth<=768&&sidebar.classList.contains('hidden'))sidebar.classList.remove('hidden');
  });
})();

function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
document.getElementById('hamburgerBtn').addEventListener('click',function(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')});
document.getElementById('overlay').addEventListener('click',closeSidebar);

// ─── 回到顶部按钮 ───
(function(){
  var btn=document.getElementById('topBtn'),wrapper=document.getElementById('contentWrapper');
  if(!btn||!wrapper)return;
  var isDragging=false,startX,startY,origX,origY;
  // 显示/隐藏
  wrapper.addEventListener('scroll',function(){
    if(wrapper.scrollTop>wrapper.clientHeight*0.7){btn.classList.add('show')}
    else{btn.classList.remove('show')}
  });
  // 点击回到顶部
  btn.addEventListener('click',function(e){
    if(isDragging){isDragging=false;return}
    wrapper.scrollTo({top:0,behavior:'smooth'})
  });
  // 拖动
  btn.addEventListener('mousedown',function(e){
    isDragging=false;startX=e.clientX;startY=e.clientY;
    origX=parseFloat(btn.style.right)||24;origY=parseFloat(btn.style.bottom)||24;
    function onMove(e2){
      var dx=startX-e2.clientX,dy=startY-e2.clientY;
      if(Math.abs(dx)>5||Math.abs(dy)>5)isDragging=true;
      var newRight=Math.max(8,Math.min(origX+dx,wrapper.clientWidth-btn.offsetWidth-8));
      var newBottom=Math.max(8,Math.min(origY+dy,wrapper.clientHeight-btn.offsetHeight-8));
      btn.style.right=newRight+'px';btn.style.bottom=newBottom+'px';
    }
    function onUp(){document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp)}
    document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
    e.preventDefault();
  });
  // 触屏拖动
  btn.addEventListener('touchstart',function(e){
    isDragging=false;var t=e.touches[0];
    startX=t.clientX;startY=t.clientY;
    origX=parseFloat(btn.style.right)||24;origY=parseFloat(btn.style.bottom)||24;
    function onMove(e2){e2.preventDefault();var t2=e2.touches[0];
      var dx=startX-t2.clientX,dy=startY-t2.clientY;
      if(Math.abs(dx)>5||Math.abs(dy)>5)isDragging=true;
      var newRight=Math.max(8,Math.min(origX+dx,wrapper.clientWidth-btn.offsetWidth-8));
      var newBottom=Math.max(8,Math.min(origY+dy,wrapper.clientHeight-btn.offsetHeight-8));
      btn.style.right=newRight+'px';btn.style.bottom=newBottom+'px';
    }
    function onUp(){document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onUp)}
    document.addEventListener('touchmove',onMove,{passive:false});document.addEventListener('touchend',onUp);
  },{passive:true});
  // 窗口尺寸变化时确保不超出边界
  window.addEventListener('resize',function(){
    var r=parseFloat(btn.style.right)||24,b=parseFloat(btn.style.bottom)||24;
    btn.style.right=Math.min(r,wrapper.clientWidth-btn.offsetWidth-8)+'px';
    btn.style.bottom=Math.min(b,wrapper.clientHeight-btn.offsetHeight-8)+'px';
  });
})();

</script>
</body>
