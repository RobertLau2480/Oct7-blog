"\n我想写的，是我的网名——**安巢鸟**。第一次听，甚至可能会觉得有点奇怪。\n\n事情大概要从半年前说起。那天，我想起来自己的B站账号还缺个正式的网名（其实就是之前太懒，一直随便顶着个名凑合）。作为一个不折不扣的“取名废”，只能想到安这个网名（源自我的姓氏），而且我也喜欢这个字，安静，安宁 ，~~（与我咋咋呼呼的性格互补了说是）~~       \n\n偶然在西窗烛中看见了杜甫的《洗兵马》\n  \n>**东走无复忆鲈鱼，南飞觉有安巢鸟。**  \n\n这首诗初看，便惊艳到我了，杜甫一贯的沉郁顿挫的风格，现实与理想的结合，总之，我很喜欢这首诗。 再加上由于 《鸟之诗》 以及其他作品的影响，我也很喜欢鸟这个意向，他们自由翱翔于天地之间。所以这个网名也就出现了。      \n\n既然开发了评论功能，我也很好奇：各位的网名背后，都有着怎样的故事呢？欢迎在评论区分享给我呀，感谢 o(^▽^)o","content/杂谈/index.md":"---\ntitle: 杂谈\nlang: zh-CN\n---\n\n这个专栏中，我想和屏幕前的你聊聊。","content/留言.md":"---\ntitle: 留言板\ndescription: 欢迎在安巢鸟的博客留言板留下您的足迹。登录 GitHub 账号即可留言交流，评论由 Giscus 驱动。\n---\n\n<style>\n.guestbook-intro {\n  text-align: center;\n  padding: 1.5rem 1rem 0;\n  color: var(--darkgray);\n}\nhtml[data-theme=\"dark\"] .guestbook-intro,\nhtml[saved-theme=\"dark\"] .guestbook-intro {\n  color: #b8b8b8;\n}\n<\/style>\n\n<div class=\"guestbook-intro\">\n  <p>欢迎留下您的足迹，任何想法、建议或闲聊都很欢迎 🌟<\/p>\n  <p>评论按点赞递减排列，若您看到了您认为有用的评论请不要吝啬自己的赞<\/p>\n  <p>若有人回复了您的评论，在Github中收件箱可以收到<\/p>\n  <p style=\"font-size:0.85rem;opacity:0.6;\">评论由 Giscus 驱动，需登录 GitHub 账号<\/p>\n<\/div>\n","content/计算机入门指南/index.md":"---\ntitle: 计算机入门指南\nlang: zh-CN\n---\n种下一棵树最好的时间是十年前，其次是现在。而笔者动笔的契机，是偶然读到了 Hans Wan 和 Windy Deng 编写的个人博客《你缺失的那门计算机课》。而在自己摸索电脑、屡屡碰壁又屡屡得到前人帮助的过程中，笔者深感“薪火相传”的必要性——等我有能力了，也一定要反哺这个社区。\n\n恰逢高考结束的这个暑假，在与这届毕业的高三学长们交流后，笔者愈发觉得这件事迫在眉睫。于是，这个博客诞生了。\n\n这个博客不会把重心聚焦在具体软件的使用（但重要的也会稍微讲点），笔者更希望教给大家解决问题的思路，AI 篇也是如此，笔者更想聊聊提示词背后的构建逻辑，而不是简单粗暴地甩给你一大坨所谓的复制即用，但换个场景或 AI 迭代后就失效的 Prompt。\n\n最后，笔者希望大家将 **人人为我，我为人人** 的互联网精神传承下去，遇到有困难的新手出一份力。\n\n由于笔者才疏学浅，若文中有任何硬伤或不妥之处，强烈欢迎各位读者老爷指出，评论功能的话暂时不打算开发，敬请谅解。\n\n- **联系方式**： birdhomeward@gmail.com（由于笔者刚入高二，学业压力较大，可能没法及时回复，抱歉）\n- 💡 **本站图片版权声明**：本博客文章除部分图片引用自厂商公开宣传素材或遵循 CC 协议的开源社区外，其余实操图片均为笔者原创。如有侵权，请联系  birdhomeward@gmail.com，笔者将第一时间配合删除。","content/计算机入门指南/基础入门/01 认识你的电脑.md":"（此篇写于2026年7月。具体硬件推荐或价格都基于当前情况书写）\n## 前言\n（书写时间为2026.7，知识部分未来短时间内大概通用，但型号推荐仅供参考）\n\n装过台式机的朋友，大概都体验过挑选主板、CPU、显卡等配件时的纠结；哪怕是电脑小白，多半也刷到过“5060”之类的配置字眼。\n\n这篇博客不想去卷各大品牌的跑分对比，只想用通俗的语言，带你搞懂每个部件到底是干嘛的，以及如何判断好坏——**防止去电脑城或者网购时，被黑心老板当肥羊宰。** 若读完有兴趣了解更多知识，请搜索硬件茶谈相关视频。    \n\n本篇所有硬件书写格式大多都为*知识科普，挑选建议，使用时注意事项* 。\n\n### 主板\n\n主板主板，顾名思义，就是一块板子，你的绝大部分电脑配件都安装在上面，外设（除了显示器）一般也与他相连。下图展示的便是较为高端的华硕 (ASUS) TUF GAMING Z590-PLUS WIFI 主板\n\n ![[主板.jpg#pic_center|219]]\n<center><small>图片来源：Unsplash License / 作者：Andrey Matveev<\/small><\/center>\n\n\n#### 基础功能：\n（可以理解成军事基地）\n1. 提供场地（即物理载体，否则你的配件怎么固定呢）\n2. 后勤保障（即供电，主板上有复杂的供电模块（VRM））\n3. 交通公路（即数据通路，主板上密密麻麻的电路）\n\n由于主板知识较为复杂，在此不过多赘述      \n新手要注意的就是这块主板与你的CPU与是否兼容，内存条插槽为DDR4还是DDR5，以及芯片组的档次（笔者推荐大部分人购买B系列，除非预算低或高）\n\n\n### CPU\n\n<center>下图为英特尔酷睿 i9-10900                    <\/center>\n\n![[CPU.jpg#pic_center|230]]\n\n<center><small>图片来源：Unsplash License / 作者：Andrey Matveev<\/small><\/center>\n\n非常重要的配件，沿用刚才的军事比喻的话就类似于将军，负责战术计算，核心决策 ~~（怪不得人家中文名叫中央处理器）~~ 。总而言之就是给所有硬件下达命令的。\n\n虽然 CPU 看着是一块板，实则不然。它内部是由多个核心组成的，“双核”、“四核”就是指它的核心数。   \n\n核心越多，工作效率肯定越快……吗？实则不然。在架构相同的前提下，我们可以简单套用一个粗暴的公式：**性能 = 核心数 $\\times$ 主频**。（只是类比，实际比这复杂得多）有时候 $10 \\times 1 < 1 \\times 100$ 的道理大家都懂。 为了防止核心多但全在“摸鱼”，就有了 “主频” 的概念。它代表 CPU 的时钟频率（CPU内部的数字信号每秒钟震荡的次数，也就是CPU工作的速度）。        \n\n若核心大小不同，则被称为大小核，可以更好平衡性能和功耗，Windows11系统就针对大小核有专门的优化。还有一个概念叫线程数，也就是能同时处理多个任务。\n\n并不是说核心数越多、主频越高的处理器性能就一定强，这在实际应用中是一个十分复杂的综合平衡关系。\n\n#### 常见型号：\n\n两家厂商都很有默契地把产品分成了 3、5、7、9 四个档次（类似宝马的3系、5系、7系）：\n1. **入门/办公**：i3 / R3（注：AMD 的 3 系列近几年在零售市场存在感较低）\n2. **主流游戏/高性价比**：i5 / R5 / Ultra 5（目前两家都在打架的主战场）\n3. **高端生产力/发烧友**：i7 / i9 / R7 / R9\n\n\n#### **防坑指南：**   \n不要盲目迷信数字！**并不是叫 i7 就一定强于 i5。** 电子产品买新不买旧，隔代如隔山。拿好几年前的老旧 i7 去碰瓷今年的最新款 i5，只会被沦为路边一条。\n\n至于之前让人诟病的 i9-13900K/14900K 闪退风波，懂的都懂，新手不碰顶配基本踩不到这个雷，在此不作展开。                 \n\n倒是可以解释一下CPU名字的意思，如英特尔 i9-13900K，i9 不解释了，13 是指第 13 代， 900 指性能档次。一般来说同代中数字越大，核心越多、频率更高、性能越强，K是后缀，具体意思见下表，AMD Ryzen 7 7800X3D，7 就是上文所说的档次，第二个 7 代表推出年份，数字越大越新，8 指性能档次，第一个 0 指架构代数，越大越好，最后一个不重要，X3D 同理也为后缀\n\n| 厂商        | 后缀      | 解释与建议                          |\n| --------- | ------- | ------------------------------ |\n| **Intel** | **无后缀** | 自带核显，不能超频。不折腾、日常用最省心。          |\n| **Intel** | **K**   | 性能最强，解除了频率限制，但发热大、需要好散热。       |\n| **Intel** | **F**   | 砍掉了内置显卡。**性价比最高**，但必须搭配独立显卡使用。 |\n| **Intel** | **KF**  | 既能超频又没有核显。游戏发烧友最爱，性价比高。        |\n| **AMD**   | **无后缀** | 功耗低、发热小。性价比极高，通常自带基础核显。        |\n| **AMD**   | **X**   | 官方帮你“超频”好了的型号，性能比无后缀略强。        |\n| **AMD**   | **X3D** | **游戏神器！** 玩游戏的帧率极高。            |\n| **AMD**   | **G**   | 处理器内置了很强的显卡。**不买独显**也能流畅玩轻度游戏。 |\n\n#### **装机注意事项：** \n1. 注意与主板是否匹配，这两家CPU主板不互通。\n2. 有防呆设计（防止你装反），所以发现放不进去时，请去检查是不是没有对准，不要大力出奇迹弄坏针脚。\n3. 注意撕膜，CPU散热器（即风冷 or 水冷）底座有层膜，不撕无法散热，CPU温度会异常。\n4. CPU 表面必须涂抹适量导热硅脂，这玩意 *“当你觉得少了点“*  说明刚好，笔者一般是九点涂法（点九个小点）\n5. 如果买了带有 **F** 尾缀（如 i5-14400F）或者无核显的旧款 AMD 处理器， **必须要额外购买独立显卡** 且显示器与独立显卡连接，否则无法亮屏（显卡篇具体解释）\n\n### 内存条（RAM）\n\n笔者写下此篇时，由于AI的原因，内存条和金条一样贵，令人感慨。话说回来，内存条类似军营中传令兵，负责把将军马上要用的文件和命令临时放在身边，方便随时调阅。（务必注意，RAM内存条断电就会失去一切存储信息，和硬盘（SSD/HDD）不同）        \n\n内存条（RAM）比较重要的概念，笔者认为是世代代号（ DDR ）和工作频率（ MHz ）。它们决定了内存与 CPU 之间的数据传输带宽。带宽越大，数据送达 CPU 的速度就越快，不仅能防止 CPU 闲置“发呆”，还能显著提升游戏的最低帧（1% Low 帧），让游戏画面减少突然的卡顿。至于大家在测评时看到的所谓时序的概念，就是指内存条响应 CPU 指令的延迟时间。具体过程极其复杂，不详细讲述。（至于高端颗粒超频等笔者不在此讲解，因为笔者认为这并不适合电脑小白。）\n\n![[RAM.jpg|347]]\n<center><small>图片来源：Unsplash License / 作者：Andrey Matveev（没看走眼的话这应该是Goodram IRDM Pro 系列 DDR4内存条）<\/small><\/center>\n\n#### 作用：\n\n1. 临时数据中转站：由于下文介绍的硬盘（SSD/HDD）速度较慢，CPU来不及处理的或者要随时调用的数据，就先暂时存放在此。\n2. 决定处理多任务的能力：相信大家买手机都有 “16+512” 这种选项，虽然手机厂商在你那512GB存储空间不够时也会说 “内存不足” ，但请读者理解，电脑上的内存就是指前面的 16，大家之所以要买大内存的手机，应该是为了游戏，微信，QQ，挂后台不被手机 “杀” 了，正是因为内存条在后台把这些程序的运行数据同时 “兜住” 。\n\n\n#### 产品迭代：\n\n1. 低频 DDR4（如 2133 MHz、2400MHz ）及更早的 DDR3，若不是读者有意购买，那就是被老板坑了，旧时代的电子小垃圾。\n2. 若为老电脑或预算低，高频 DDR4 可以考虑，技术极其成熟，价格已经跌到谷底，时序（延迟）非常低。但是上限被锁死，其他配件也注定落后。\n3. 大部分人的选择应该是 DDR5 内存，这个主要看个人预算，**以及和主板，CPU 的适配性**\n\n#### 小贴士：\n\n1. 现在内存条大多购买两根，**千万不要买两个工作频率不同的内存条！** 电脑只会向下兼容。\n2. 内存条组装时也有防呆设计，请勿大力出奇迹。\n3. 装机时请插入2,4通道，**绝对不能乱插** \n4. 笔者个人推荐若日常使用，16 GB 内存就够用，若有更高的需求，如生产力，游戏，那建议32 GB 起步 。至于运行频率，6000 MHz - 6800MHz 完全够用。至于时序，DDR5 的 6000 ，6400 ，6800 MHz 笔者推荐的甜品频率分别为 CL 30 ， 32 ， 34。（笔者观点一直是根据预算选择，先保证容量再去想别的。）\n5. 电脑到手重启时狂按Delete（不同主板方式可能不同，如联想为F1，惠普为F10，若不确定，可询问客服 or 售后）进入bios界面，开启 XMP / EXPO，否则内存条频率会自动降低，白花钱购买高频率内存条。\n\n### 显卡（GPU）\n（显卡知识较多）\n\n终于来到了常规电脑中最贵的一部分了（从严格定义来讲 GPU 不等于显卡， GPU 属于显卡的一个组成部分，但笔者认为这是无意义的咬文嚼字），继续用兵营式比喻就类似于冲锋骑兵，负责大规模冲锋，即图像渲染和大计算量工作，大家在部分软件（如Wallpaper Engine）中见到的“硬件加速”就是指使用显卡加速。\n\n再说到另一个极其重要的概念——显存。当 GPU 在疯狂计算时，数据是怎么来的呢？ CPU 靠内存条提供，而GPU就靠显存，所以可以将显存理解为专属于显卡的高速内存。此外，显卡算完的每一帧画面，在真正显示到你屏幕上的前一秒，都必须暂存在显存的“帧缓冲区”，若显存太小，可能导致游戏画面瞬间卡成幻灯片、动态贴图变马赛克、甚至游戏直接闪退。（共享显存≠独立显存，前者速度较慢）    \n\n还有一个概念叫位宽，单位为bit。严谨概念为“在一个时钟周期内能够同时传输的二进制数据位数”，大家可以把显卡理解成仓库，位宽就是出入口个数，八个出入口肯定不如十六个出入口对吧。所以不要看到16 GB 显存就认为是好显卡，仓库大小固然重要，但只有一个出入口啥用没有。（当年市场上的RTX 3060 12GB和RTX 3060 8GB。8G 版本不只是显存小了，它的显存位宽也被硬生生阉割了一截，所以买卡看清具体规格参数，不能只看型号的前半截或者只看显存）\n\n显卡有集成显卡（简称为核显或集显）和独立显卡（简称为独显）的区别，前者就是将 GPU 整合在 CPU 内部，性能较差，后者就是大家常见的一长条的形式，将GPU独立出来，性能较好。\n\n现在显卡主要厂商有两家分别是英伟达（NVIDIA），超威半导体（AMD），也是俗称的“绿厂”和“红厂”。（还有英特尔（Intel）和中国的摩尔线程等，但笔者认为新手没必要购买红绿厂之外的显卡，故不过多赘述）     \n\n（笔者建议大家使用显卡支架，防止显卡下垂或插槽变形，当然假如你不想买，拿个裁剪到合适长度的一次性筷子也是可以的，但比较难刚好卡住）\n\n![[GPU.jpg|248]] ![[支架.jpg|252]] \n<center><small>左图来源：Unsplash License / 作者：Andrey Matveev（显卡应该是NVIDIA GeForce RTX 2080 Super Founders Edition）右图为笔者电脑的\"显卡支架\"<\/small><\/center>\n\n\n>现在互联网上总给人一种人均4090,5090的错觉，仿佛别的显卡都不配叫显卡一样，笔者劝大家莫要盲目购买高配置，按照需求和预算来永远是最好的。毕竟真正使用人数最多的还是3060。\n\n#### 产品选择：\n（这一块每个人有各自看法，笔者只是给出我的观点，欢迎在评论区讨论）\n\n1. 1080P区 ~~（注：这是指分辨率而不是人数）~~：假如预算有限，显示器分辨率也不高，可以购买RTX 3060 12G / RTX 4060 / RX 6600。（3060是真好用）\n2. 2K过渡区：若预算中等，建议考虑RX 7700 XT / RX 6750 GRE / RTX 4060 Ti (8G)。\n3. 2K进阶/4K初步：预算在中等和顶配之间，建议RX 9070 (16G)、RTX 4070 / 5070 (12G)\n4. 4K顶配区：若预算极高，建议RTX 4080 / 5080 / 4090、RX 9070 XT等高端大显卡。\n\n***特别提示*** ：显卡型号是指GPU型号，可以理解成汽车发动机，但是外壳由非公版显卡厂商（比如华硕、七彩虹、微星、蓝宝石、讯景）制作，所以同一个显卡价格天差地别。具体可看下表。\n\n| **品牌 (芯片阵营)**           | **实用/性价比系列**                | **中高端/旗舰系列**                    | **小白选购避坑总结**                        |\n| ----------------------- | --------------------------- | ------------------------------- | ----------------------------------- |\n| **华硕 ASUS** (N卡/A卡)     | Dual (雪豹/巨手) / TUF Gaming   | ROG Strix (猛禽)                  | Dual 散热扎实且价格亲民；ROG 溢价较高，追求极限用料选     |\n| **微星 MSI** (N卡/A卡)      | Ventus (万图师)                | Gaming Slim (魔龙) / SUPRIM (超龙)  | 万图师用料和散热中规中矩，胜在价格便宜；魔龙/超龙散热和静音表现更出色 |\n| **七彩虹 Colorful** (N卡)   | Battle-Ax (战斧)              | Ultra W / Vulcan (火神) / Neptune | 战斧/Ultra 颜值高且支持个人送保，售后对小白非常友好       |\n| **技嘉 GIGABYTE** (N卡/A卡) | Windforce (风魔) / Eagle (猎鹰) | Gaming OC (魔鹰) / AORUS (超级雕)    | 猎鹰/魔鹰性价比不错，购买时选择正规授权店铺即可            |\n| **蓝宝石 Sapphire** (A卡)   | Pulse (脉冲星)                 | NITRO+ (超白金)                    | A 卡首选品牌之一，脉冲星性价比极高，超白金做工顶级          |\n| **讯景 XFX 或撼讯** (A卡)     | SWFT (核心力量) / Fighter       | MERC (磁吸) / Hellhound (红魔)      | SWFT/Fighter 价格实惠；磁吸/红魔堆料足，散热强劲     |\n\n### 硬盘（HDD/SSD）\n（本篇知识也较多，感觉较为难懂的读者只把注意事项和品牌记住也勉强够用）\n\n又到了一个最近死贵的硬件了，还记得之前的内存条中提到的 “16+512” 的例子吗，其中的 512GB 在电脑中就是归硬盘管的。用来存储数据，类似军营中存放武器的仓库。断电了其中的数据也不会消失（严格来说，不论是固态还是机械，很长时间不通电数据依然会丢失，所以加入一个硬盘中存储着重要数据记得每年拿出来通电一下）\n\n硬盘分为两种，机械硬盘（hard disk drive，即常说的HDD）内部有高速旋转的金属/玻璃盘片（涂有磁性介质）和极其精密的磁头。抗震性差，噪音和功耗大，数据可恢复性较强，容量大，价格低，速度慢。      \n\n固态硬盘（solid state drive，即常说的SSD）内部没有任何物理机械运动部件，主要由主控芯片和闪存芯片组成。抗震性强，噪音和功耗小，数据几乎不能恢复，容量小、价格高、速度较快。        \n\n\n![[HDD.jpg|282]] ![[SSD.jpg|312]]\n<center><small>左图来源：Wikimedia Commons 作者：Evan-Amos (Vanamo Media)\n右图来源：Unsplash License，作者：Andrey Matveev（三星 980 PRO 系列 NVMe M.2 固态硬盘）<\/center><\/small>\n\n\n\n若预算高直接全上固态即可，但若预算很低，可以考虑采用固态 + 机械的思路，各取所长。     \n\n（事先声明，硬盘知识非常繁多，在此仅做简单介绍，若感觉笔者推荐不合你心，可以选择额外了解其他知识后再选择，这里只推荐笔者认为适用于大部分人的。）              \n\n首先机械硬盘使用场景大多为企业冷数据（即那些访问频率低但是需要保留的数据）存储，因为他们这些数据不用频繁调用，机械硬盘的低成本优势就显露出来了，NAS（私人云盘）同理。       \n\n机械硬盘大多被分为两种，CMR（垂直磁记录）和 SMR（叠瓦磁记录），两种各有优缺点，但笔者强烈推荐大家购买 CMR（垂直式）        \n\n| **对比维度**           | **CMR (垂直磁记录)**      | **SMR (叠瓦磁记录)**         |\n| ------------------ | -------------------- | ----------------------- |\n| **磁道排列方式**         | 平行排列，互不干扰            | 重叠排列（像屋顶瓦片）             |\n| **持续写入速度**         | **稳定**（150–250 MB/s） | **极不稳定**（缓存用尽后跌至几 MB/s） |\n| **响应延迟**           | 极低                   | 遇重写时响应时间极长，易引发软件卡死      |\n| **NAS / RAID 兼容性** | **完美支持**             | **坚决禁用**                |\n| **适合场景**           | 高频下载、NAS、工作资料、频繁改写   | 低频纯读取、一次性写入的冷数据备份       |\n| **小白选购建议**         | **首选**               | **尽量避开**                |\n\n买固态时，常常会看到“M.2”、“NVMe”、“SATA”、“PCIe 4.0”等名词，笔者在此处粗浅的用一张表格进行说明：          \n\n| **维度**                 | **常见规格 / 名称**                                         | **通俗解释与选择建议**                                                                                   |\n| ---------------------- | ----------------------------------------------------- | ----------------------------------------------------------------------------------------------- |\n| **物理形态 (Form Factor)** | **M.2 (2280)** _(主流)_<br><br>  <br><br>**2.5 寸 SATA** | • **M.2**：像口香糖一样直接插在主板上，无需接线。<br><br>  <br><br>• **2.5寸**：像小黑盒，需要接电源线和数据线（老电脑升级用）。              |\n| **数据通道 (Bus)**         | **PCIe 通道** _(极速)_<br><br>  <br>**SATA 3.0 总线**       | • **PCIe**：高速公路，数据传输上限极高。<br><br>  <br><br>• **SATA**：普通马路，物理上限只有 600 MB/s。（实际使用一般550 MB/s 顶天了） |\n| **传输协议 (Protocol)**    | **NVMe 协议** _(高效)_<br><br><br>**AHCI 协议**             | • **NVMe**：专为固态硬盘高并发读写设计的现代协议。<br><br>  <br><br>• **AHCI**：老旧协议，专为传统机械硬盘设计。                     |\n\nPCel 类似之前讲的 DDR ，有多个版本迭代，PCel 4.0 就够用了，5.0 虽性能强悍但发热严重（预算上两万当我没说）不适合普通用户。（买 M.2 固态认准 PCIe 4.0 NVMe 协议，千万别买到披着 M.2 外皮的老旧 SATA 固态！！）      \n\n至于颗粒，具体不展开了，感兴趣可以搜索硬件茶谈进行深入学习，笔者的建议是**别买QLC，买 TLC** ，购买牌子货基本上不会踩雷~~（笔者朋友购买七彩虹硬盘就踩雷了）~~ \n\n| **品牌阵营**     | **代表品牌**                                              | **芯片与技术背景**             | **经典型号代表**                                             |\n| ------------ | ----------------------------------------------------- | ----------------------- | ------------------------------------------------------ |\n| **中国自主芯片巨头** | **致态 (Zhitai)**                                       | 长江存储（晶栈架构），TLC 颗粒品质极其顶尖 | TiPlus7100 (PCIe 4.0 无缓存性价比高) / TiPro7000 (带缓存旗舰)      |\n| **韩国半导体巨头**  | **三星 (Samsung)**<br><br>  <br>**海力士 (SK hynix)**      | 自研主控+颗粒，性能巅峰，溢价略高       | 三星 990 Pro / 980 Pro<br><br>  <br><br>海力士 Platinum P41 |\n| **日本半导体厂**   | **铠侠 (Kioxia)**                                       | 原东芝存储，性价比高，品质稳定         | 铠侠 SD10 / G2                                           |\n| **美系大厂**     | **西部数据 (WD)**<br><br>  <br><br>**美光 / 英睿达 (Crucial)** | 拥有独立晶圆厂与主控研发能力          | 西数 SN770 / SN850X<br><br>  <br><br>英睿达 T500            |\n（固态硬盘尽量保留 10%~20% 的剩余空间，不要彻底填满，装机时记得撕膜，至于分盘等操作笔者会在  “哇，新电脑” 篇讲解）\n\n### 电源（PSU）\n\n给整台电脑供能，极其重要，电压跟不上，配件再好也白瞎。作用是将家庭用的220V 交流电，转化为电脑内部硬件所需的直流电输出。           \n\n**要注意额定功率而非峰值功率/瞬时功率**\n<center><small>（若预算有余，瓦数能高不低，毕竟这玩意耐用的很，更新配件后也能继续用）<\/small><\/center>\n\n$\\text{建议额定功率} = (\\text{CPU 极限功耗} + \\text{显卡极限功耗} + 150\\text{W 保留余量}) \\div 80\\%$\n\n还要注意的有80 PLUS ，这是衡量电源将交流电转为直流电时的省电效率，也就是一个电源是否省电（由于转化过程中会有一部分变成热量散失）除非预算特别吃紧的话选择白牌或铜牌，不然建议选择金牌（富哥无脑白金或钛金）。但是需要注意的是， 80 PLUS 只能在一定程度上反应电源用料，不能完全代表用料。\n\n线材结构类型有非模组和全模组，区别如下（半模组不上不下的，不推荐，感兴趣者可自行学习）\n1. **非模组（直出）**：所有线材直接从电源内部伸出来，不能拆卸。多余的线砸在机箱底部，非常影响美观和走线。\n2. **全模组**：电源主体只有插孔，所有线材按需插拔。好走线、方便更换定制线，是高端装机的主流。\n\nATX是一种规范标准，选择 3.0 / 3.1 ，不然容易突然关机，极小概率直接炸。       \n\n<center>电源铭牌（这张图展示的是曜越钢影 GF1 850W电源）<\/center>\n![[PSU.jpg#pic_center|347]]\n解释一下电源铭牌哪些数据值得看，以及对应的意思\n\n\n#### 注意事项：\n\n<font color=\"#ff0000\">严禁显卡热插拔<\/font>（指在电脑通电开机的状态下，直接拔出或插入硬件），热插拔会导致显卡直接报废（虽然有极少一部分显卡支持热插拔，但是不要热插拔！不要热插拔！不要热插拔！）\n\n<font color=\"#ff0000\">不要混用模组线<\/font>，否则跳闸甚至整机报废都有可能，哪怕同品牌不同型号也不要混用！！！！\n","content/计算机入门指南/基础入门/index.md":"\n本篇主要介绍一些电脑的基础，如组成，系统等，可能对你使用电脑没有显著帮助，但笔者希望大家耐心看完前几篇，对电脑有一个较为基础完善的认识。后面笔者再会讲常用软件，和良好电脑操作习惯 ~~（这位先生，你也不想你的电脑C盘被文件狠狠塞满吧）~~ 。为读者使用电脑打下良好基础。    \n\n若你只想学习基础操作，即常说的 “会用电脑” 的水平，笔者认为这一篇章完全足够了。","content/随笔/01.md":"\n\n\n\n\n","content/随笔/index.md":"---\ntitle: 随笔\nlang: zh-CN\n---\n网上常说，少年意气是不可再生之物。\n\n我很喜欢《金缕衣》里的那句：“花开堪折直须折，莫待无花空折枝。” 所谓的“折花”，大概就是把那些转瞬即逝的灵感、情绪、甚至偶尔的废话，用文字记录下来。\n\n记性不好，所以想用写作和遗忘抗衡一下。趁还年轻，趁还能被生活打动，在这个角落，留下点痕迹。"};</script>

.sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);height:100vh;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;z-index:10}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:20px;font-weight:700;color:var(--accent)}
.sidebar-header p{font-size:12px;color:var(--text-secondary);margin-top:4px}
.search-box{margin:12px 16px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;transition:border-color .2s;color:var(--text)}
.search-box:focus{border-color:var(--accent)}
.search-box::placeholder{color:var(--text-secondary)}
.tree-wrapper{flex:1;overflow-y:auto;padding:8px 0}
.tree-wrapper::-webkit-scrollbar{width:6px}
.tree-wrapper::-webkit-scrollbar-thumb{background:var(--text-secondary);border-radius:3px}
.tree-item{cursor:pointer;user-select:none}
.tree-item-inner{display:flex;align-items:center;gap:6px;padding:6px 16px;font-size:14px;color:var(--text);transition:background .15s}
.tree-item-inner:hover{background:var(--hover)}
.tree-item-inner.active{background:var(--active);color:var(--accent);font-weight:600}
.tree-icon{width:16px;text-align:center;flex-shrink:0;font-size:12px;color:var(--text-secondary)}
.tree-arrow{width:16px;flex-shrink:0;transition:transform .2s;font-size:10px;color:var(--text-secondary)}
.tree-arrow.open{transform:rotate(90deg)}
.tree-children{display:none}
.tree-children.open{display:block}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-header{display:flex;align-items:center;padding:8px 20px;border-bottom:1px solid var(--border);gap:8px;min-height:52px}
.hamburger{display:none;background:none;border:none;font-size:20px;cursor:pointer;padding:4px 8px;color:var(--text);border-radius:4px}
.hamburger:hover{background:var(--hover)}
.desktop-title{font-size:16px;font-weight:600;color:var(--accent);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.header-btn{background:none;border:1px solid var(--border);font-size:18px;cursor:pointer;padding:6px 10px;color:var(--text);border-radius:6px;transition:all .2s;line-height:1;display:flex;align-items:center;justify-content:center}
.header-btn:hover{background:var(--hover);border-color:var(--accent)}
.menu-dropdown{position:fixed;right:20px;top:52px;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:8px 0;min-width:200px;z-index:200;display:none}
.menu-dropdown.open{display:block}
.menu-section{padding:6px 16px 4px;font-size:11px;font-weight:600;color:var(--text-secondary);letter-spacing:1px;text-transform:uppercase}
.menu-dropdown-item{padding:8px 20px;font-size:14px;color:var(--text);cursor:pointer;transition:background .15s;white-space:nowrap;display:flex;align-items:center;gap:8px}
.menu-dropdown-item:hover{background:var(--dropdown-hover)}
.content-wrapper{flex:1;overflow-y:auto;padding:40px;max-width:860px;width:100%;margin:0 auto}
.content-wrapper::-webkit-scrollbar{width:8px}
.content-wrapper::-webkit-scrollbar-thumb{background:var(--text-secondary);border-radius:4px}
.markdown-body{line-height:1.8;font-size:16px;color:var(--text)}
.markdown-body h1{font-size:28px;font-weight:700;margin-bottom:24px;padding-bottom:12px;border-bottom:2px solid var(--border)}
.markdown-body h2{font-size:22px;font-weight:600;margin:28px 0 12px}
.markdown-body h3{font-size:18px;font-weight:600;margin:24px 0 8px}
.markdown-body p{margin:12px 0}
.markdown-body ul,.markdown-body ol{margin:8px 0;padding-left:24px}
.markdown-body li{margin:4px 0}
.markdown-body code{background:var(--code-bg);padding:2px 6px;border-radius:4px;font-size:14px;font-family:"Fira Code","Consolas",monospace;color:var(--text)}
.markdown-body pre{background:var(--code-bg);padding:16px;border-radius:8px;overflow-x:auto;margin:16px 0}
.markdown-body pre code{background:none;padding:0;font-size:14px}
.markdown-body blockquote{border-left:4px solid var(--accent);padding:8px 16px;margin:16px 0;background:var(--blockquote-bg);color:var(--text-secondary)}
.markdown-body img{max-width:100%;border-radius:8px;margin:16px 0;box-shadow:var(--img-shadow)}
.markdown-body a{color:var(--accent);text-decoration:none}
.markdown-body a:hover{text-decoration:underline}
.markdown-body hr{border:none;border-top:1px solid var(--border);margin:24px 0}
.markdown-body table{width:100%;border-collapse:collapse;margin:16px 0}
.markdown-body th,.markdown-body td{border:1px solid var(--border);padding:8px 12px;text-align:left}
.markdown-body th{background:var(--hover);font-weight:600}
.markdown-body strong{font-weight:700}
.overlay{display:none;position:fixed;inset:0;background:var(--overlay-bg);z-index:99}
.overlay.show{display:block}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-secondary)}
.empty-state h2{font-size:24px;margin-bottom:8px}
.empty-state p{font-size:14px}
@media(max-width:768px){
.hamburger{display:block}
.main-header{padding:8px 12px}
.sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:var(--shadow);transition:transform .3s ease}
.sidebar.open{transform:translateX(0)}
.content-wrapper{padding:20px 16px}
.markdown-body{font-size:15px}
.markdown-body h1{font-size:22px}
.markdown-body h2{font-size:18px}
.markdown-body h3{font-size:16px}
.desktop-title{display:none}
.menu-dropdown{right:12px}
}
</style>
</head>
<body>
<!-- 背景层 -->
<div class="bg-layer" id="bgLayer">
  <video class="bg-video" id="bgVideo" muted loop playsinline preload="auto"></video>
  <img class="bg-image" id="bgImage" alt="" style="display:none">
</div>
<!-- 全屏模糊遮罩（覆盖全部背景） -->
<div class="bg-blur-overlay"></div>
<!-- 两侧边缘更浅模糊 -->
<div class="bg-edge-left"></div>
<div class="bg-edge-right"></div>

<div class="overlay" id="overlay"></div>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>📝 个人博客</h1>
    <p>— 风清月白</p>
  </div>
  <input class="search-box" id="searchBox" type="text" placeholder="搜索文章..." oninput="filterTree(this.value)">
  <div class="tree-wrapper" id="treeWrapper"></div>
</nav>

<div class="main">
  <div class="main-header">
    <button class="hamburger" id="hamburgerBtn">☰</button>
    <span class="desktop-title" id="desktopTitle">📝 个人博客</span>
    <span id="mobileTitle" style="font-size:15px;font-weight:600;color:var(--text);display:none;">个人博客</span>
    <div class="header-actions">
      <button class="header-btn" id="themeToggle" title="切换深浅色模式">🌙</button>
      <button class="header-btn" id="menuBtn" title="菜单">☰</button>
    </div>
  </div>
  <div class="menu-dropdown" id="menuDropdown">
    <div class="menu-section">背景切换</div>
    <div class="menu-dropdown-item" data-bg-option="video">🎬 视频背景</div>
    <div class="menu-dropdown-item" data-bg-option="neutral">⬜ 中性</div>
    <div class="menu-dropdown-item" data-bg-option="warm">🟨 暖色</div>
    <div class="menu-dropdown-item" data-bg-option="cool">🟦 冷色</div>
  </div>
  <div class="content-wrapper" id="contentWrapper">
    <div class="empty-state" id="emptyState">
      <h2>👋 欢迎</h2>
      <p>从左侧目录选择一篇文章开始阅读</p>
    </div>
    <div class="markdown-body" id="markdownBody" style="display:none;"></div>
  </div>
</div>

<script>
// ─── 深浅色模式 ───
(function() {
  const saved = localStorage.getItem('theme');
  if (saved === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  } else if (saved === 'light') {
    document.documentElement.removeAttribute('data-theme');
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();

function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  if (isDark) {
    html.removeAttribute('data-theme');
    localStorage.setItem('theme', 'light');
    document.getElementById('themeToggle').textContent = '🌙';
  } else {
    html.setAttribute('data-theme', 'dark');
    localStorage.setItem('theme', 'dark');
    document.getElementById('themeToggle').textContent = '☀️';
  }
  updateBackground();
}
document.getElementById('themeToggle').addEventListener('click', toggleTheme);

(function() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
})();

// ─── 背景切换 ───
function getBgOption() {
  return localStorage.getItem('bgOption') || 'video';
}

function setBgOption(opt) {
  localStorage.setItem('bgOption', opt);
  document.documentElement.setAttribute('data-bg', opt === 'video' ? '' : opt);
  document.querySelectorAll('[data-bg-option]').forEach(el => {
    el.style.fontWeight = el.dataset.bgOption === opt ? '600' : '';
    el.style.color = el.dataset.bgOption === opt ? 'var(--accent)' : '';
  });
  updateBackground();
}

function updateBackground() {
  const opt = getBgOption();
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const isMobile = window.innerWidth <= 768;
  const videoEl = document.getElementById('bgVideo');
  const imgEl = document.getElementById('bgImage');

  if (opt === 'video') {
    var videoSrc = '';
    var imgSrc = '';
    if (isMobile) {
      imgSrc = isDark ? 'static/bgv/dark_bg.jpg' : 'static/bgv/light_bg.jpg';
    } else {
      videoSrc = isDark ? 'static/bgv/dark_bg.mp4' : 'static/bgv/light_bg.mp4';
      imgSrc = isDark ? 'static/bgv/dark_bg.jpg' : 'static/bgv/light_bg.jpg';
    }
    imgEl.src = imgSrc;
    imgEl.style.display = 'block';
    if (videoSrc) {
      videoEl.src = videoSrc;
      videoEl.style.display = 'block';
      videoEl.play().catch(function(){});
    } else {
      videoEl.style.display = 'none';
    }
  } else {
    videoEl.style.display = 'none';
    imgEl.style.display = 'none';
  }
}

// 初始化背景
(function() {
  const savedBg = localStorage.getItem('bgOption');
  if (savedBg && savedBg !== 'video') {
    document.documentElement.setAttribute('data-bg', savedBg);
    document.querySelectorAll('[data-bg-option]').forEach(el => {
      if (el.dataset.bgOption === savedBg) {
        el.style.fontWeight = '600';
        el.style.color = 'var(--accent)';
      }
    });
  }
  updateBackground();
})();

document.querySelectorAll('[data-bg-option]').forEach(el => {
  el.addEventListener('click', function(e) {
    e.stopPropagation();
    setBgOption(this.dataset.bgOption);
    document.getElementById('menuDropdown').classList.remove('open');
  });
});

window.addEventListener('resize', function() {
  if (getBgOption() === 'video') updateBackground();
});

// ─── 菜单下拉 ───
document.getElementById('menuBtn').addEventListener('click', function(e) {
  e.stopPropagation();
  document.getElementById('menuDropdown').classList.toggle('open');
});
document.addEventListener('click', function() {
  document.getElementById('menuDropdown').classList.remove('open');
});
document.getElementById('menuDropdown').addEventListener('click', function(e) {
  e.stopPropagation();
});

// ─── 应用初始化 ───
initApp();

function initApp() {
  if (treeData.length === 0) {
    document.getElementById('treeWrapper').innerHTML = '<p style="padding:20px;color:#d32f2f;">❌ 请先运行 node scripts/build.js 构建</p>';
    return;
  }
  renderTree(treeData, document.getElementById('treeWrapper'));

  if (articlePath && contentMap[articlePath]) {
    expandToPath(articlePath);
    const el = document.querySelector(`[data-path="${articlePath}"]`);
    loadFile(articlePath, el || null);
  } else {
    const first = findFirstFile(treeData);
    if (first && contentMap[first.path]) {
      setTimeout(() => {
        const el = document.querySelector(`[data-path="${first.path}"]`);
        if (el) el.click();
      }, 100);
    }
  }
}

function expandToPath(filePath) {
  const parts = filePath.split('/');
  const dirParts = parts.slice(0, -1);
  var items = document.querySelectorAll('.tree-item');
  for (var i = 0; i < items.length; i++) {
    var inner = items[i].querySelector('.tree-item-inner');
    if (!inner) continue;
    var arrow = inner.querySelector('.tree-arrow');
    if (!arrow) continue;
    var folderName = inner.querySelector('span:last-child').textContent;
    for (var j = 1; j < dirParts.length; j++) {
      if (dirParts[j] === folderName) {
        arrow.classList.add('open');
        var ch = items[i].querySelector('.tree-children');
        if (ch) ch.classList.add('open');
        break;
      }
    }
  }
}

function renderTree(nodes, container, depth) {
  if (depth === undefined) depth = 0;
  for (const node of nodes) {
    if (node.type === 'folder' && node.name === 'images') continue;
    const item = document.createElement('div');
    item.className = 'tree-item';

    if (node.type === 'folder') {
      const inner = document.createElement('div');
      inner.className = 'tree-item-inner';
      inner.style.paddingLeft = (16 + depth * 16) + 'px';
      inner.innerHTML = '<span class="tree-arrow">▶</span><span class="tree-icon">📁</span><span>' + esc(node.name) + '</span>';
      inner.addEventListener('click', function(e) {
        e.stopPropagation();
        this.querySelector('.tree-arrow').classList.toggle('open');
        item.querySelector('.tree-children').classList.toggle('open');
      });
      item.appendChild(inner);
      const children = document.createElement('div');
      children.className = 'tree-children';
      renderTree(node.children || [], children, depth + 1);
      item.appendChild(children);
    } else {
      const inner = document.createElement('div');
      inner.className = 'tree-item-inner';
      const label = node.label === 'index'
        ? (node.path.split('/').slice(-2, -1)[0] || '首页')
        : node.label;
      inner.style.paddingLeft = (16 + depth * 16) + 'px';
      inner.innerHTML = '<span class="tree-icon">' + getIcon(node.path) + '</span><span>' + esc(label) + '</span>';
      inner.dataset.path = node.path;
      inner.addEventListener('click', function() {
        window.location.href = getArticleUrl(node.path);
      });
      item.appendChild(inner);
    }
    container.appendChild(item);
  }
}

function getArticleUrl(filePath) {
  let url = filePath
    .replace(/^content\//, '')
    .replace(/\/index\.md$/, '/index.html')
    .replace(/\.md$/, '.html');
  return '/' + url;
}

function getIcon(path) {
  const name = path.split('/').pop();
  if (name === '关于.md') return 'ℹ️';
  if (name === '留言.md') return '💬';
  if (name === '个人博客.md') return '📰';
  if (name === 'index.md') return '🏠';
  return '📄';
}

function esc(t) {
  var d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

function loadFile(path, element) {
  var actives = document.querySelectorAll('.tree-item-inner.active');
  for (var i = 0; i < actives.length; i++) actives[i].classList.remove('active');
  if (element) element.classList.add('active');

  var mdText = contentMap[path];
  if (!mdText) {
    document.getElementById('markdownBody').innerHTML = '<p style="color:#d32f2f;">❌ 文章内容未找到</p>';
    return;
  }

  document.getElementById('emptyState').style.display = 'none';
  var mdBody = document.getElementById('markdownBody');
  mdBody.style.display = 'block';

  var basePath = path.lastIndexOf('/') !== -1 ? path.substring(0, path.lastIndexOf('/')) : 'content';
  var processed = mdText.replace(/!\[([^\]]*)\]\(\.\/images\//g, '![$1](' + basePath + '/images/');
  mdBody.innerHTML = marked.parse(processed);

  var imgs = mdBody.querySelectorAll('img');
  for (var i = 0; i < imgs.length; i++) {
    imgs[i].style.cursor = 'zoom-in';
    imgs[i].addEventListener('click', function() { window.open(this.src, '_blank'); });
  }

  if (quotesData.length > 0) {
    var quoteEl = mdBody.querySelector('.random-quote');
    if (quoteEl && quoteEl.textContent.indexOf('正在加载') !== -1) {
      var idx = Math.floor(Math.random() * quotesData.length);
      var q = quotesData[idx];
      quoteEl.textContent = '「 ' + q.text + ' 」';
    }
  }

  var label = element ? element.querySelector('span:last-child').textContent : '';
  document.getElementById('desktopTitle').textContent = '📝 ' + (label || '个人博客');
  document.getElementById('mobileTitle').textContent = label || '个人博客';
  closeSidebar();
}

function filterTree(query) {
  var items = document.querySelectorAll('.tree-item');
  var q = query.toLowerCase().trim();
  var children = document.querySelectorAll('.tree-children');
  var arrows = document.querySelectorAll('.tree-arrow');
  for (var i = 0; i < children.length; i++) children[i].classList.remove('open');
  for (var i = 0; i < arrows.length; i++) arrows[i].classList.remove('open');
  if (!q) { for (var i = 0; i < items.length; i++) items[i].style.display = ''; return; }
  for (var i = 0; i < items.length; i++) {
    var text = items[i].textContent.toLowerCase();
    items[i].style.display = text.indexOf(q) !== -1 ? '' : 'none';
    if (text.indexOf(q) !== -1) {
      var ch = items[i].querySelector('.tree-children');
      var ar = items[i].querySelector('.tree-arrow');
      if (ch) ch.classList.add('open');
      if (ar) ar.classList.add('open');
    }
  }
}

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
document.getElementById('hamburgerBtn').addEventListener('click', openSidebar);
document.getElementById('overlay').addEventListener('click', closeSidebar);

function findFirstFile(nodes) {
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].type === 'file' && nodes[i].name === 'index.md') return nodes[i];
  }
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].type === 'file') return nodes[i];
    if (nodes[i].children) { var f = findFirstFile(nodes[i].children); if (f) return f; }
  }
  return null;
}
</script>
</body>
</html>
