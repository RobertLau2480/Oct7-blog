</head>

<style>
/* 性能优化：不对所有元素应用过渡，只对需要动画的元素 */
html{transition:color-scheme .25s}
*{margin:0;padding:0;box-sizing:border-box}
.site-main,.sidebar,.bg-layer,.bg-blur-overlay,.bg-edge-overlay,.search-box,.tree-item-inner,.header-btn,.sidebar-toggle,.menu-dropdown,.top-btn,.content-wrapper,.markdown-body,.music-btn{transition:background-color .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease,opacity .25s ease}
.bg-video,.bg-image{transition:opacity .25s ease}
:root{--sidebar-width:280px;--bg:#f8f9fa;--sidebar-bg:#fff;--border:#e0e0e0;--text:#333;--text-secondary:#666;--hover:#f0f0f0;--active:#e3f2fd;--accent:#1976d2;--code-bg:#f5f5f5;--shadow:0 2px 8px rgba(0,0,0,.08);--header-bg:#fff;--dropdown-bg:#fff;--dropdown-hover:#f0f0f0;--overlay-bg:rgba(0,0,0,.3);--blockquote-bg:#f8fbff;--img-shadow:0 2px 8px rgba(0,0,0,.08);--content-bg:rgba(248,249,250,.88);--sidebar-content-bg:rgba(255,255,255,.93);--header-content-bg:rgba(255,255,255,.93);--edge-blur-color:rgba(255,255,255,.15);--edge-blur-home:rgba(255,255,255,.55);--font-base:16px;--font-md-h1:28px;--font-md-h2:22px;--font-md-h3:18px;--font-md-body:16px;--font-sidebar:14px;--font-title:16px}
[data-font="small"]{--font-base:14px;--font-md-h1:24px;--font-md-h2:19px;--font-md-h3:16px;--font-md-body:14px;--font-sidebar:12px;--font-title:14px}
[data-font="large"]{--font-base:18px;--font-md-h1:32px;--font-md-h2:25px;--font-md-h3:21px;--font-md-body:18px;--font-sidebar:16px;--font-title:18px}
[data-bg="neutral"]{--bg:#f0f0f0;--content-bg:rgba(245,245,245,.88);--sidebar-content-bg:rgba(250,250,250,.93);--header-content-bg:rgba(250,250,250,.93);--edge-blur-color:rgba(255,255,255,.18)}
[data-bg="warm"]{--bg:#faf5eb;--content-bg:rgba(253,247,237,.88);--sidebar-content-bg:rgba(255,250,240,.93);--header-content-bg:rgba(255,250,240,.93);--edge-blur-color:rgba(255,250,240,.18)}
[data-bg="cool"]{--bg:#eef4fa;--content-bg:rgba(237,244,252,.88);--sidebar-content-bg:rgba(242,248,255,.93);--header-content-bg:rgba(242,248,255,.93);--edge-blur-color:rgba(242,248,255,.18)}
[data-theme="dark"]{--bg:#1a1a2e;--sidebar-bg:#2d2d38;--border:#3a3a48;--text:#e0e0e0;--text-secondary:#a0a0b0;--hover:#1a1a3e;--active:#1a3a6e;--accent:#64b5f6;--code-bg:#1e1e3a;--shadow:0 2px 8px rgba(0,0,0,.3);--header-bg:#2d2d38;--dropdown-bg:#2d2d38;--dropdown-hover:#1a1a3e;--overlay-bg:rgba(0,0,0,.5);--blockquote-bg:#1a1a3e;--img-shadow:0 2px 8px rgba(0,0,0,.3);--content-bg:rgba(30,30,38,.88);--sidebar-content-bg:rgba(45,45,55,.93);--header-content-bg:rgba(45,45,55,.93);--edge-blur-color:rgba(45,45,55,.18)}
[data-theme="dark"][data-bg="neutral"]{--content-bg:rgba(30,30,40,.88);--sidebar-content-bg:rgba(35,35,50,.93);--header-content-bg:rgba(35,35,50,.93);--bg:#1e1e28;--sidebar-bg:#232332;--edge-blur-color:rgba(0,0,0,.14)}
[data-theme="dark"][data-bg="warm"]{--content-bg:rgba(40,35,28,.88);--sidebar-content-bg:rgba(50,42,30,.93);--header-content-bg:rgba(50,42,30,.93);--bg:#282318;--sidebar-bg:#322a1e;--edge-blur-color:rgba(0,0,0,.14)}
[data-theme="dark"][data-bg="cool"]{--content-bg:rgba(26,30,42,.88);--sidebar-content-bg:rgba(30,38,55,.93);--header-content-bg:rgba(30,38,55,.93);--bg:#1a1e2a;--sidebar-bg:#1e2637;--edge-blur-color:rgba(0,0,0,.14)}
.bg-layer{position:fixed;inset:0;z-index:-3;overflow:hidden;background:var(--bg)}
.bg-video{position:absolute;width:100%;height:100%;object-fit:cover;opacity:0}
.bg-image{position:absolute;width:100%;height:100%;object-fit:cover;opacity:0}
.bg-blur-overlay{position:fixed;inset:0;z-index:-2;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.bg-edge-overlay{position:fixed;inset:0;z-index:-1;pointer-events:none;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);background:var(--edge-blur-color)}
.bg-edge-overlay.home{background:rgba(255,255,255,.55)}
[data-theme="dark"] .bg-edge-overlay.home{background:rgba(0,0,0,.55)}
.sidebar,.main-header,.menu-dropdown,.content-wrapper{background:var(--content-bg)}
.content-wrapper.transparent{background:transparent}
.sidebar{background:var(--sidebar-content-bg)}
.main-header{background:var(--header-content-bg)}
.menu-dropdown{background:var(--sidebar-content-bg)}
.search-box{background:var(--content-bg)}
.overlay{display:none;position:fixed;inset:0;background:var(--overlay-bg);z-index:50}
.overlay.show{display:block}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;color:var(--text);height:100vh;display:flex;overflow:hidden;position:relative}
.sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);height:100vh;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;z-index:100;transition:width .35s ease,min-width .35s ease,border-color .35s ease}
@media(min-width:769px){.sidebar.hidden{width:0;min-width:0;border-right-color:transparent;overflow:hidden}}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border);cursor:pointer}
.sidebar-header h1{font-size:20px;font-weight:700;color:var(--accent)}
.sidebar-header p{font-size:12px;color:var(--text-secondary);margin-top:4px}
.search-box{margin:12px 16px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:var(--font-sidebar);outline:none;transition:border-color .2s;color:var(--text)}
.search-box:focus{border-color:var(--accent)}
.search-box::placeholder{color:var(--text-secondary)}
.tree-wrapper{flex:1;overflow-y:auto;padding:8px 0}
.tree-wrapper::-webkit-scrollbar{width:6px}
.tree-wrapper::-webkit-scrollbar-thumb{background:var(--text-secondary);border-radius:3px}
.tree-item{cursor:pointer;user-select:none}
.tree-item-inner{display:flex;align-items:center;gap:6px;padding:6px 16px;font-size:var(--font-sidebar);color:var(--text);transition:background .15s}
.tree-item-inner:hover{background:var(--hover)}
.tree-item-inner.active{background:var(--active);color:var(--accent);font-weight:600}
.tree-icon{width:16px;text-align:center;flex-shrink:0;font-size:12px;color:var(--text-secondary)}
.tree-arrow{width:16px;flex-shrink:0;transition:transform .2s;font-size:10px;color:var(--text-secondary)}
.tree-arrow.open{transform:rotate(90deg)}
.tree-children{display:none}
.tree-children.open{display:block}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-header{display:flex;align-items:center;padding:8px 20px;border-bottom:1px solid var(--border);gap:8px;min-height:52px}
/* ─── 侧栏切换按钮（仅桌面端） ─── */
.sidebar-toggle{display:flex;background:none;border:none;font-size:14px;cursor:pointer;padding:4px 8px;color:var(--text);border-radius:4px;align-items:center;justify-content:center;width:28px;transition:transform .3s ease}
.sidebar-toggle:hover{background:var(--hover)}
@media(max-width:768px){.sidebar-toggle{display:none}}

.hamburger{display:none;background:none;border:none;font-size:20px;cursor:pointer;padding:4px 8px;color:var(--text);border-radius:4px}
.hamburger:hover{background:var(--hover)}
.desktop-title{font-size:var(--font-title);font-weight:600;color:var(--accent);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.header-btn{background:none;border:1px solid var(--border);font-size:18px;cursor:pointer;padding:6px 10px;color:var(--text);border-radius:6px;transition:all .2s;line-height:1;display:flex;align-items:center;justify-content:center}
.header-btn:hover{background:var(--hover);border-color:var(--accent)}
.menu-dropdown{position:fixed;right:20px;top:52px;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:8px 12px;min-width:220px;z-index:200;display:none}
.menu-dropdown.open{display:block}
.menu-section{padding:4px 4px 6px;font-size:11px;font-weight:600;color:var(--text-secondary);letter-spacing:1px;text-transform:uppercase}
.bg-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 0 8px 0}
.bg-grid-item{text-align:center;padding:8px 4px;font-size:13px;color:var(--text);cursor:pointer;border-radius:6px;transition:all .2s;background:var(--bg);border:1px solid var(--border)}
.bg-grid-item:hover{background:var(--hover);border-color:var(--accent)}
.bg-grid-item.active{background:var(--active);color:var(--accent);font-weight:600;border-color:var(--accent)}
.font-row{display:flex;gap:6px;padding:8px 0 4px}
.font-item{flex:1;text-align:center;padding:8px 4px;font-size:13px;color:var(--text);cursor:pointer;border-radius:6px;transition:all .2s;background:var(--bg);border:1px solid var(--border)}
.font-item:hover{background:var(--hover);border-color:var(--accent)}
.font-item.active{background:var(--active);color:var(--accent);font-weight:600;border-color:var(--accent)}
.menu-divider{border:none;border-top:1px solid var(--border);margin:4px 0}
.music-player{padding:4px 4px 8px}
.music-info{font-size:13px;color:var(--accent);font-weight:600;text-align:center;padding:6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-controls{display:flex;gap:6px;justify-content:center}
.music-btn{background:none;border:1px solid var(--border);font-size:18px;cursor:pointer;padding:6px 14px;color:var(--text);border-radius:6px;transition:all .2s;line-height:1}
.music-btn:hover{background:var(--hover);border-color:var(--accent)}
.music-btn.playing{background:var(--active);border-color:var(--accent)}
.music-btn.loading{position:relative;pointer-events:none;opacity:.7}
.music-btn .spinner{display:none;width:18px;height:18px;border:2px solid var(--border);border-top:2px solid var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
.music-btn.loading .spinner{display:block}
.music-btn.loading .btn-icon{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
#giscus-container{position:relative;width:100%}
.volume-row{padding:6px 2px 0;display:flex;align-items:center;gap:8px}
.volume-slider{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--border);outline:none;cursor:pointer}
.volume-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;transition:transform .15s}
.volume-slider::-webkit-slider-thumb:hover{transform:scale(1.2)}
.volume-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:none;cursor:pointer}
.content-wrapper{flex:1;overflow-y:auto;padding:40px;max-width:860px;width:100%;margin:0 auto;transition:max-width .35s ease}
.content-wrapper::-webkit-scrollbar{width:8px}
.content-wrapper::-webkit-scrollbar-thumb{background:var(--text-secondary);border-radius:4px}
.markdown-body{line-height:1.8;font-size:var(--font-md-body);color:var(--text)}
.markdown-body h1{font-size:var(--font-md-h1);font-weight:700;margin-bottom:24px;padding-bottom:12px;border-bottom:2px solid var(--border)}
.markdown-body h2{font-size:var(--font-md-h2);font-weight:600;margin:28px 0 12px}
.markdown-body h3{font-size:var(--font-md-h3);font-weight:600;margin:24px 0 8px}
.markdown-body p{margin:12px 0}
.markdown-body ul,.markdown-body ol{margin:8px 0;padding-left:24px}
.markdown-body li{margin:4px 0}
.markdown-body code{background:var(--code-bg);padding:2px 6px;border-radius:4px;font-size:calc(var(--font-md-body) - 2px);font-family:"Fira Code","Consolas",monospace;color:var(--text)}
.markdown-body pre{background:var(--code-bg);padding:16px;border-radius:8px;overflow-x:auto;margin:16px 0}
.markdown-body pre code{background:none;padding:0;font-size:calc(var(--font-md-body) - 2px)}
.markdown-body blockquote{border-left:4px solid var(--accent);padding:8px 16px;margin:16px 0;background:var(--blockquote-bg);color:var(--text-secondary)}
.markdown-body img{max-width:100%;border-radius:8px;margin:16px 0;box-shadow:var(--img-shadow)}
.markdown-body a{color:var(--accent);text-decoration:none}
.markdown-body a:hover{text-decoration:underline}
.markdown-body hr{border:none;border-top:1px solid var(--border);margin:24px 0}
.markdown-body table{width:100%;border-collapse:collapse;margin:16px 0}
.markdown-body th,.markdown-body td{border:1px solid var(--border);padding:8px 12px;text-align:left}
.markdown-body th{background:var(--hover);font-weight:600}
.markdown-body strong{font-weight:700}
.markdown-body .home-wrapper{max-width:720px;margin:0 auto;padding:10px 0}
.markdown-body .home-header{text-align:center;padding:20px 0 12px}
.markdown-body .site-title{font-size:var(--font-md-h1);font-weight:700;color:var(--accent);margin-bottom:8px}
.markdown-body .random-quote{font-size:15px;color:var(--text-secondary);font-style:italic;margin:4px 0}
.markdown-body .author-words p{font-size:var(--font-md-body);color:var(--text);line-height:1.9;margin:0;text-align:center}
.markdown-body .friend-link{text-align:center;margin-top:24px;font-size:14px;color:var(--text-secondary)}
.markdown-body .card-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin:20px 0 0;padding:0}
.markdown-body .glass-card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 16px;border-radius:12px;background:var(--sidebar-content-bg);border:1px solid var(--border);text-decoration:none !important;color:var(--text) !important;transition:all .25s ease;cursor:pointer;margin:0;box-sizing:border-box}
.markdown-body .glass-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent);background:var(--active);text-decoration:none !important}
.markdown-body .glass-card .card-icon{font-size:32px;margin-bottom:10px}
.markdown-body .glass-card .card-title{font-size:16px;font-weight:600;color:var(--accent);margin-bottom:6px}
.markdown-body .glass-card .card-desc{font-size:13px;color:var(--text-secondary);line-height:1.5;margin:0 0 8px}
.markdown-body .glass-card .card-preview{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.markdown-body .glass-card .card-preview-item{font-size:12px;padding:2px 8px;border-radius:4px;background:var(--bg);color:var(--text-secondary);white-space:nowrap}
.markdown-body .shelf-wrapper{max-width:600px;margin:0 auto;padding:20px 0}
.markdown-body .shelf-header h2{font-size:var(--font-md-h2);font-weight:600;margin-bottom:24px;color:var(--text);text-align:center}
.markdown-body .shelf-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin:0;padding:0}
.markdown-body .shelf-card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 16px;border-radius:12px;background:var(--sidebar-content-bg);border:1px solid var(--border);text-decoration:none !important;color:var(--text) !important;transition:all .25s ease;cursor:pointer;margin:0;box-sizing:border-box}
.markdown-body .shelf-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent);background:var(--active);text-decoration:none !important}
.markdown-body .shelf-card .shelf-icon{font-size:36px;margin-bottom:12px}
.markdown-body .shelf-card .shelf-title{font-size:16px;font-weight:600;color:var(--accent);margin-bottom:6px}
.markdown-body .shelf-card .shelf-desc{font-size:13px;color:var(--text-secondary);line-height:1.5;margin:0}
@media(max-width:768px){
.markdown-body .card-grid,.markdown-body .shelf-grid{grid-template-columns:1fr;gap:12px}
.markdown-body .glass-card,.markdown-body .shelf-card{padding:16px 14px;flex-direction:row;gap:14px;text-align:left}
.markdown-body .glass-card .card-icon,.markdown-body .shelf-card .shelf-icon{font-size:26px;margin-bottom:0}
.markdown-body .glass-card .card-preview{justify-content:flex-start}
}
/* ─── 回到顶部按钮 ─── */
.top-btn{position:absolute;bottom:24px;right:24px;width:42px;height:42px;border-radius:50%;background:var(--bg);color:var(--text-secondary);font-size:18px;font-weight:700;line-height:42px;text-align:center;cursor:pointer;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease,background .25s ease,color .25s ease;user-select:none;touch-action:none;border:1px solid var(--border)}
.top-btn.show{opacity:1;pointer-events:auto}
.top-btn:hover{transform:scale(1.1);background:var(--hover);color:var(--accent)}
@media(max-width:768px){.top-btn{bottom:16px;right:16px;width:38px;height:38px;font-size:16px;line-height:38px}}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-secondary)}
.empty-state h2{font-size:24px;margin-bottom:8px}.empty-state p{font-size:14px}
@media(max-width:768px){
.hamburger{display:block}
.main-header{padding:8px 12px}
.sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:var(--shadow);transition:transform .3s ease}
.sidebar.open{transform:translateX(0)}
.content-wrapper{padding:20px 16px}
.markdown-body{font-size:var(--font-md-body)}
.markdown-body h1{font-size:var(--font-md-h1)}
.markdown-body h2{font-size:var(--font-md-h2)}
.markdown-body h3{font-size:var(--font-md-h3)}
.desktop-title{display:none}
.header-actions{margin-left:auto}
.menu-dropdown{right:12px}
}
</style>
</head>
<body>
<div class="bg-layer" id="bgLayer">
  <video class="bg-video" id="bgVideo" muted loop playsinline preload="auto"></video>
  <img class="bg-image" id="bgImage" alt="" style="display:none">
</div>
<div class="bg-edge-overlay"></div>

<audio id="bgAudio" preload="auto" style="display:none" src></audio>

<div class="overlay" id="overlay"></div>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header" id="sidebarHeader">
    <h1>安巢鸟的小站</h1>
    <p>HomewardBird's Site</p>
  </div>
  <input class="search-box" id="searchBox" type="text" placeholder="搜索文章..." oninput="filterTree(this.value)">
  <div class="tree-wrapper" id="treeWrapper"></div>
</nav>

<div class="main">
  <div class="main-header">
    <button class="hamburger" id="hamburgerBtn">☰</button>
    <button class="sidebar-toggle" id="sidebarToggle" title="切换侧栏">⇐</button>
    <span class="desktop-title" id="desktopTitle">安巢鸟的小站</span>
    <span id="mobileTitle" style="font-size:15px;font-weight:600;color:var(--text);display:none;">安巢鸟的小站</span>
    <div class="header-actions">
      <button class="header-btn" id="themeToggle" title="切换深浅色模式">🌙</button>
      <button class="header-btn" id="menuBtn" title="菜单">⚙️</button>
    </div>
  </div>
  <div class="menu-dropdown" id="menuDropdown">
    <div class="menu-section">背景</div>
    <div class="bg-grid">
      <div class="bg-grid-item active" data-bg-option="video">🎬 视频</div>
      <div class="bg-grid-item" data-bg-option="neutral">⬜ 中性</div>
      <div class="bg-grid-item" data-bg-option="warm">🟨 暖色</div>
      <div class="bg-grid-item" data-bg-option="cool">🟦 冷色</div>
    </div>
    <hr class="menu-divider">
    <div class="menu-section">字体</div>
    <div class="font-row">
      <div class="font-item" data-font-option="small">A⁻ 小字</div>
      <div class="font-item active" data-font-option="default">A 默认</div>
      <div class="font-item" data-font-option="large">A⁺ 大字</div>
    </div>
    <hr class="menu-divider">
    <div class="menu-section">音乐</div>
    <div class="music-player" id="musicPlayer">
      <div class="music-info" id="musicTitle">未播放</div>
      <div class="music-controls">
        <button class="music-btn" id="musicPrev" title="上一首">⏮</button>
        <button class="music-btn" id="musicToggle" title="播放/暂停"><span class="spinner"></span><span class="btn-icon">▶️</span></button>
        <button class="music-btn" id="musicNext" title="下一首">⏭</button>
      </div>
      <div class="volume-row">
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
      </div>
    </div>
  </div>
  <div class="content-wrapper" id="contentWrapper">

<script>

function updateBackground(){

      else{i.style.display='none';v.style.opacity='0';v.src=isDark?'/static/bgv/dark_bg.mp4':'/static/bgv/light_bg.mp4';v.style.display='block';v.onloadeddata=function(){requestAnimationFrame(function(){v.style.opacity='1'});v.play().catch(function(){})};if(v.readyState>=2){requestAnimationFrame(function(){v.style.opacity='1'});v.play().catch(function(){})}}

(function(){
  document.querySelectorAll('.bg-grid-item').forEach(function(el){el.classList.remove('active')});

(function(){

// ─── 音乐播放器 ───
var pList=window.__PLAYLIST__||[],cT=parseInt(localStorage.getItem('musicTrack')||'0'),aE=document.getElementById('bgAudio');
var userPaused=localStorage.getItem('musicUserPaused')==='true';

function loadTrack(index,autoPlay){
  if(!pList.length)return;
  if(index<0)index=pList.length-1;
  if(index>=pList.length)index=0;
  cT=index;localStorage.setItem('musicTrack',cT);
  var s=pList[cT],src='/'+s.file;
  document.getElementById('musicTitle').textContent=s.name;
  // 显示加载中
  var tb=document.getElementById('musicToggle');tb.classList.add('loading');
  aE.pause();
  // 切歌时重置进度
  var savedTime=parseFloat(localStorage.getItem('musicTime_'+cT)||'0');
  if(autoPlay===undefined)autoPlay=true;
  if(aE.src&&aE.src.indexOf(src)!==-1&&aE.readyState>=2){aE.currentTime=Math.min(savedTime,aE.duration||savedTime);if(!userPaused&&autoPlay)aE.play().catch(function(){});tb.classList.remove('loading');updatePlayBtn();return}
  var h=aE._lh;if(h)aE.removeEventListener('loadedmetadata',h);
  aE.src=src;aE.load();
var handler=function(){var tm=Math.min(savedTime,aE.duration||savedTime);aE.currentTime=tm;tb.classList.remove('loading');if(!userPaused&&autoPlay)aE.play().catch(function(){});aE.removeEventListener('loadedmetadata',handler);aE._lh=null};
  aE.addEventListener('loadedmetadata',handler);aE._lh=handler;
  updatePlayBtn();
}
function updatePlayBtn(){var b=document.getElementById('musicToggle'),c=b.querySelector('.btn-icon');if(!aE.paused&&!aE.ended){c.textContent='⏸';b.classList.add('playing')}else{c.textContent='▶️';b.classList.remove('playing')}}
function togglePlay(){if(!pList.length)return;if(aE.paused){userPaused=false;localStorage.setItem('musicUserPaused','false');if(!aE.src){loadTrack(cT,true);return}aE.play().catch(function(){});updatePlayBtn()}else{userPaused=true;localStorage.setItem('musicUserPaused','true');aE.pause();updatePlayBtn()}}
function nextTrack(){userPaused=false;localStorage.setItem('musicUserPaused','false');localStorage.removeItem('musicTime_'+cT);loadTrack(cT+1,true)}
function prevTrack(){userPaused=false;localStorage.setItem('musicUserPaused','false');localStorage.removeItem('musicTime_'+cT);loadTrack(cT-1,true)}
aE.addEventListener('timeupdate',function(){if(!aE.paused)localStorage.setItem('musicTime_'+cT,aE.currentTime)});
aE.addEventListener('play',function(){updatePlayBtn()});
aE.addEventListener('pause',function(){updatePlayBtn()});
var sV=parseFloat(localStorage.getItem('musicVolume')||'0.8');aE.volume=sV;document.getElementById('volumeSlider').value=sV*100;
document.getElementById('volumeSlider').addEventListener('input',function(e){e.stopPropagation();var v=this.value/100;aE.volume=v;localStorage.setItem('musicVolume',v)});
aE.addEventListener('ended',function(){userPaused=false;localStorage.setItem('musicUserPaused','false');localStorage.removeItem('musicTime_'+cT);nextTrack()});
if(pList.length){
  document.getElementById('musicTitle').textContent=pList[cT].name;
  var _t=parseFloat(localStorage.getItem('musicTime_'+cT)||'0');
  if(_t>0||localStorage.getItem('musicTrack')){
    loadTrack(cT,false);
    // 有历史记录时自动加载但不播放，按钮显示▶️等待用户点击
  }
}

// ─── ⭐ SPA 导航（音乐不中断的关键） ───
function navigateTo(url) {
  // 从 URL 推导出对应的 fileKey
  // /index.html → content/index.md
  // /关于.html → content/关于.md
  // /杂谈/01 网名的故事.html → content/杂谈/01 网名的故事.md
  // /杂谈/ → content/杂谈/index.md
  var fileKey = url.replace(/^\//, '');
  if (fileKey === '' || fileKey === 'index.html') { fileKey = 'content/index.md'; }
  else { fileKey = 'content/' + fileKey.replace(/\/$/, '/index').replace(/\.html$/, '') + '.md'; }

  // 检查该文章是否存在内容
  var md = contentMap[fileKey];
  if (!md) { window.location.href = url; return; } // 回退到正常导航

  // 更新 URL（不刷新页面）
  history.pushState({ fileKey: fileKey }, '', url);

  // 更新侧栏高亮和展开
  document.querySelectorAll('.tree-item-inner.active').forEach(function(el){el.classList.remove('active')});
  document.querySelectorAll('.tree-item .tree-arrow.open').forEach(function(el){el.classList.remove('open')});
  document.querySelectorAll('.tree-item .tree-children.open').forEach(function(el){el.classList.remove('open')});
  var el = document.querySelector('[data-path="'+fileKey+'"]');
  if (el) el.classList.add('active');

  // 展开祖先文件夹
  var parts = fileKey.split('/'); var dirs = parts.slice(1, -1);
  document.querySelectorAll('.tree-item').forEach(function(item){
    var inner = item.querySelector('.tree-item-inner'); if(!inner)return;
    var arrow=inner.querySelector('.tree-arrow'); if(!arrow)return;
    var name=inner.querySelector('span:last-child').textContent;
    for(var j=0;j<dirs.length;j++){if(dirs[j]===name){arrow.classList.add('open');var ch=item.querySelector('.tree-children');if(ch)ch.classList.add('open');break}}
  });

  // 加载文章
  loadFile(fileKey, el);

  // 刷新 Giscus 评论（按当前 URL 路径加载对应讨论）
  var gFrame = document.querySelector('iframe.giscus-frame');
  if (gFrame) {
    gFrame.contentWindow.postMessage({
      giscus: { setConfig: { term: window.location.pathname } }
    }, 'https://giscus.app');
  }

  // 更新标题
  var label = '安巢鸟的小站';
  if (fileKey !== 'content/index.md') {
    var n = fileKey.replace(/^content\//,'').replace(/\.md$/,'').replace(/\/index$/,'');
    label = n + ' - 安巢鸟的小站';
  }
  document.title = label;
}

document.getElementById('sidebarHeader').addEventListener('click', function(){ navigateTo('/'); });
document.getElementById('treeWrapper').addEventListener('click', function(e){
  var target = e.target.closest('.tree-item-inner');
  if (!target || target.classList.contains('tree-item-inner-folder')) return;

});

function getArticleUrl(filePath) {
  var url = filePath.replace(/^content\//,'').replace(/\/index\.md$/,'/index.html').replace(/\.md$/,'.html');
  return '/' + url;
}

// 处理浏览器前进/后退
window.addEventListener('popstate', function(e){

    var el = document.querySelector('[data-path="'+e.state.fileKey+'"]');

// ─── 初始化 ───
initApp();
function initApp() {
  if (treeData.length === 0) { document.getElementById('treeWrapper').innerHTML = '<p style="padding:20px;color:#d32f2f;">❌ 请运行 node scripts/build.js 构建</p>'; return; }
  renderTree(treeData, document.getElementById('treeWrapper'));
  var articlePath = window.__ARTICLE_PATH__ || "";
  if (articlePath && contentMap[articlePath]) {
    // 展开并加载
    expandToPath(articlePath);
    var el = document.querySelector('[data-path="'+articlePath+'"]');
    loadFile(articlePath, el || null);
  } else {
    var first = findFirstLeafFile(treeData);
    if (first && contentMap[first.path]) { setTimeout(function(){ var el=document.querySelector('[data-path="'+first.path+'"]'); if(el)el.click(); }, 100); }
  }
}

function expandToPath(filePath) {
  var parts=filePath.split('/'),dirs=parts.slice(1,-1);
  document.querySelectorAll('.tree-item').forEach(function(item){
    var inner=item.querySelector('.tree-item-inner');if(!inner)return;
    var arrow=inner.querySelector('.tree-arrow');if(!arrow)return;
    var name=inner.querySelector('span:last-child').textContent;
    for(var j=0;j<dirs.length;j++){if(dirs[j]===name){arrow.classList.add('open');var ch=item.querySelector('.tree-children');if(ch)ch.classList.add('open');break}}
  });
}

function renderTree(nodes,container,depth,parentPath){
  if(depth===undefined)depth=0;
  if(parentPath===undefined)parentPath='';
  nodes.forEach(function(node){
    if(node.type==='folder'&&node.name==='images')return;
    var item=document.createElement('div');item.className='tree-item';
    if(node.type==='folder'){
      var folderPath=parentPath+'/'+encodeURIComponent(node.name);
      var inner=document.createElement('div');inner.className='tree-item-inner tree-item-inner-folder';inner.style.paddingLeft=(16+depth*16)+'px';
      inner.innerHTML='<span class="tree-arrow">▶</span><span class="tree-icon">📁</span><span>'+esc(node.name)+'</span>';
      var arrow=inner.querySelector('.tree-arrow');
      arrow.addEventListener('click',function(e){e.stopPropagation();this.classList.toggle('open');item.querySelector('.tree-children').classList.toggle('open')});
      inner.addEventListener('click',function(e){e.stopPropagation();navigateTo(folderPath+'/')});
      item.appendChild(inner);
      var ch=document.createElement('div');ch.className='tree-children';renderTree(node.children||[],ch,depth+1,folderPath);item.appendChild(ch);
    } else {
      var inner=document.createElement('div');inner.className='tree-item-inner';
      var label=node.label==='index'?(node.path.split('/').slice(-2,-1)[0]||'首页'):node.label;
      inner.style.paddingLeft=(16+depth*16)+'px';
      inner.innerHTML='<span class="tree-icon">'+getIcon(node.path)+'</span><span>'+esc(label)+'</span>';
      inner.dataset.path=node.path;
      inner.addEventListener('click',function(e){e.preventDefault();navigateTo(getArticleUrl(node.path))});
      item.appendChild(inner);
    }
    container.appendChild(item);
  });
}
function getIcon(p){var n=p.split('/').pop();if(n==='关于.md')return'ℹ️';if(n==='留言.md')return'💬';if(n==='个人博客.md')return'📰';if(n==='index.md')return'🏠';return'📄'}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}

function loadFile(path,element){
  document.querySelectorAll('.tree-item-inner.active').forEach(function(el){el.classList.remove('active')});
  if(element)element.classList.add('active');
  var mdText=contentMap[path];
  if(!mdText){document.getElementById('markdownBody').innerHTML='<p style="color:#d32f2f;">❌ 文章内容未找到</p>';return}
  // 主页正文透明 + 遮罩（仅视频模式），其他页面恢复
  var cw=document.getElementById('contentWrapper'),eo=document.querySelector('.bg-edge-overlay');
  if(path==='content/index.md'){cw.classList.add('transparent');if(eo&&getBgOption()==='video')eo.classList.add('home')}else{cw.classList.remove('transparent');if(eo)eo.classList.remove('home')}

  document.getElementById('emptyState').style.display='none';
  var mdBody=document.getElementById('markdownBody');mdBody.style.display='block';
  var basePath=path.lastIndexOf('/')!==-1?path.substring(0,path.lastIndexOf('/')):'content';
  // 处理 Obsidian 图片语法 ![[filename.ext#hash|size]] → <img src="...">
  // 所有图片统一放在 content/images/ 目录下
  mdText = mdText.replace(/!\[\[([^\]|]+?)(?:#([^\]]*?))?(?:\|(\d+))?\]\]/g, function(m, fname, hash, size) {
    var res = '<img src="/content/images/' + fname + '"';
    if (size) res += ' width="' + size + '"';
    if (hash === 'pic_center') res += ' style="display:block;margin:0 auto"';
    res += '>';
    return res;
  });
  mdBody.innerHTML=marked.parse(mdText.replace(/!\[([^\]]*)\]\(\.\/images\//g,'![$1]('+basePath+'/images/'));
  mdBody.querySelectorAll('img').forEach(function(img){img.style.cursor='zoom-in';img.addEventListener('click',function(){window.open(this.src,'_blank')})});
  // Giscus
  var gc=document.getElementById('giscus-container');
  if(path==='content/index.md'){gc.style.display='none'}else{
    gc.style.display='block';
    if(!document.getElementById('giscus-script')){
      var dk=document.documentElement.getAttribute('data-theme')==='dark';
      var sc=document.createElement('script');sc.id='giscus-script';sc.src='https://giscus.app/client.js';
      sc.setAttribute('data-repo','HomewardBird/First_single_blog');sc.setAttribute('data-repo-id','R_kgDOTbNa5g');sc.setAttribute('data-category','Announcements');
      sc.setAttribute('data-category-id','DIC_kwDOTbNa5s4DBg2M');sc.setAttribute('data-mapping','pathname');sc.setAttribute('data-strict','0');
      sc.setAttribute('data-reactions-enabled','1');sc.setAttribute('data-emit-metadata','0');sc.setAttribute('data-input-position','top');
      sc.setAttribute('data-theme',dk?'dark':'light');sc.setAttribute('data-lang','zh-CN');sc.setAttribute('crossorigin','anonymous');sc.async=true;
      gc.appendChild(sc);
    }
  }
  if(quotesData.length>0){var qe=mdBody.querySelector('.random-quote');if(qe&&qe.textContent.indexOf('正在加载')!==-1){var idx=Math.floor(Math.random()*quotesData.length);var q=quotesData[idx];qe.textContent='「 '+q.text+' 」'}}
  var label=element?element.querySelector('span:last-child').textContent:'';
  document.getElementById('desktopTitle').textContent='📝 '+(label||'个人博客');
  document.getElementById('mobileTitle').textContent=label||'个人博客';
  closeSidebar();
}

function filterTree(q){
  var items=document.querySelectorAll('.tree-item'),query=q.toLowerCase().trim();
  document.querySelectorAll('.tree-children').forEach(function(e){e.classList.remove('open')});
  document.querySelectorAll('.tree-arrow').forEach(function(e){e.classList.remove('open')});
  if(!query){items.forEach(function(e){e.style.display=''});return}
  items.forEach(function(e){
    var t=e.textContent.toLowerCase();e.style.display=t.indexOf(query)!==-1?'':'none';
    if(t.indexOf(query)!==-1){var c=e.querySelector('.tree-children'),a=e.querySelector('.tree-arrow');if(c)c.classList.add('open');if(a)a.classList.add('open')}
  });
}


// ─── 桌面端侧栏切换（带滑动动画） ───

// ─── 回到顶部按钮 ───
(function(){
  var btn=document.getElementById('topBtn'),wrapper=document.getElementById('contentWrapper');
  if(!btn||!wrapper)return;
  var isDragging=false,startX,startY,origX,origY;
  // 显示/隐藏
  wrapper.addEventListener('scroll',function(){
    if(wrapper.scrollTop>wrapper.clientHeight*0.7){btn.classList.add('show')}
    else{btn.classList.remove('show')}
  });
  // 点击回到顶部
  btn.addEventListener('click',function(e){
    if(isDragging){isDragging=false;return}
    wrapper.scrollTo({top:0,behavior:'smooth'})
  });
  // 拖动
  btn.addEventListener('mousedown',function(e){
    isDragging=false;startX=e.clientX;startY=e.clientY;
    origX=parseFloat(btn.style.right)||24;origY=parseFloat(btn.style.bottom)||24;
    function onMove(e2){
      var dx=startX-e2.clientX,dy=startY-e2.clientY;
      if(Math.abs(dx)>5||Math.abs(dy)>5)isDragging=true;
      var newRight=Math.max(8,Math.min(origX+dx,wrapper.clientWidth-btn.offsetWidth-8));
      var newBottom=Math.max(8,Math.min(origY+dy,wrapper.clientHeight-btn.offsetHeight-8));
      btn.style.right=newRight+'px';btn.style.bottom=newBottom+'px';
    }
    function onUp(){document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp)}
    document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
    e.preventDefault();
  });
  // 触屏拖动
  btn.addEventListener('touchstart',function(e){
    isDragging=false;var t=e.touches[0];
    startX=t.clientX;startY=t.clientY;
    origX=parseFloat(btn.style.right)||24;origY=parseFloat(btn.style.bottom)||24;
    function onMove(e2){e2.preventDefault();var t2=e2.touches[0];
      var dx=startX-t2.clientX,dy=startY-t2.clientY;
      if(Math.abs(dx)>5||Math.abs(dy)>5)isDragging=true;
      var newRight=Math.max(8,Math.min(origX+dx,wrapper.clientWidth-btn.offsetWidth-8));
      var newBottom=Math.max(8,Math.min(origY+dy,wrapper.clientHeight-btn.offsetHeight-8));
      btn.style.right=newRight+'px';btn.style.bottom=newBottom+'px';
    }
    function onUp(){document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onUp)}
    document.addEventListener('touchmove',onMove,{passive:false});document.addEventListener('touchend',onUp);
  },{passive:true});
  // 窗口尺寸变化时确保不超出边界
  window.addEventListener('resize',function(){
    var r=parseFloat(btn.style.right)||24,b=parseFloat(btn.style.bottom)||24;
    btn.style.right=Math.min(r,wrapper.clientWidth-btn.offsetWidth-8)+'px';
    btn.style.bottom=Math.min(b,wrapper.clientHeight-btn.offsetHeight-8)+'px';
  });
})();

</script>
</body>
