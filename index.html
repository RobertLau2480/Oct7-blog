<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人博客</title>
<link rel="icon" type="image/png" href="/static/icon.png">
</head>
<body>
<!-- 构建注入 -->
<script>window.__TREE__ = {"tree":[]};</script>
<script>window.__FILES__ = {};</script>
<script>window.__ARTICLE_PATH__ = "";</script>
<script>window.__QUOTES__ = [];</script>
<script>window.__PLAYLIST__ = [];</script>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const treeData = window.__TREE__ ? window.__TREE__.tree : [];
const contentMap = window.__FILES__ || {};
const articlePath = window.__ARTICLE_PATH__ || "";
const quotesData = window.__QUOTES__ || [];
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box;transition:background-color .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease,opacity .25s ease}
.bg-video,.bg-image{transition:opacity .25s ease}
html{transition:color-scheme .25s}

:root {
  --sidebar-width: 280px;
  --bg: #f8f9fa;
  --sidebar-bg: #ffffff;
  --border: #e0e0e0;
  --text: #333333;
  --text-secondary: #666666;
  --hover: #f0f0f0;
  --active: #e3f2fd;
  --accent: #1976d2;
  --code-bg: #f5f5f5;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --header-bg: #ffffff;
  --dropdown-bg: #ffffff;
  --dropdown-hover: #f0f0f0;
  --overlay-bg: rgba(0,0,0,0.3);
  --blockquote-bg: #f8fbff;
  --img-shadow: 0 2px 8px rgba(0,0,0,0.08);
  --content-bg: rgba(248,249,250,0.88);
  --sidebar-content-bg: rgba(255,255,255,0.93);
  --header-content-bg: rgba(255,255,255,0.93);
  --edge-blur-color: rgba(255,255,255,0.15);
  --font-base: 16px;
  --font-md-h1: 28px;
  --font-md-h2: 22px;
  --font-md-h3: 18px;
  --font-md-body: 16px;
  --font-sidebar: 14px;
  --font-title: 16px;
}
[data-font="small"]{--font-base:14px;--font-md-h1:24px;--font-md-h2:19px;--font-md-h3:16px;--font-md-body:14px;--font-sidebar:12px;--font-title:14px}
[data-font="large"]{--font-base:18px;--font-md-h1:32px;--font-md-h2:25px;--font-md-h3:21px;--font-md-body:18px;--font-sidebar:16px;--font-title:18px}
[data-bg="neutral"]{--bg:#f0f0f0;--content-bg:rgba(245,245,245,0.88);--sidebar-content-bg:rgba(250,250,250,0.93);--header-content-bg:rgba(250,250,250,0.93);--edge-blur-color:rgba(255,255,255,0.18)}
[data-bg="warm"]{--bg:#faf5eb;--content-bg:rgba(253,247,237,0.88);--sidebar-content-bg:rgba(255,250,240,0.93);--header-content-bg:rgba(255,250,240,0.93);--edge-blur-color:rgba(255,250,240,0.18)}
[data-bg="cool"]{--bg:#eef4fa;--content-bg:rgba(237,244,252,0.88);--sidebar-content-bg:rgba(242,248,255,0.93);--header-content-bg:rgba(242,248,255,0.93);--edge-blur-color:rgba(242,248,255,0.18)}
[data-theme="dark"]{--bg:#1a1a2e;--sidebar-bg:#2d2d38;--border:#3a3a48;--text:#e0e0e0;--text-secondary:#a0a0b0;--hover:#1a1a3e;--active:#1a3a6e;--accent:#64b5f6;--code-bg:#1e1e3a;--shadow:0 2px 8px rgba(0,0,0,0.3);--header-bg:#2d2d38;--dropdown-bg:#2d2d38;--dropdown-hover:#1a1a3e;--overlay-bg:rgba(0,0,0,0.5);--blockquote-bg:#1a1a3e;--img-shadow:0 2px 8px rgba(0,0,0,0.3);--content-bg:rgba(30,30,38,0.88);--sidebar-content-bg:rgba(45,45,55,0.93);--header-content-bg:rgba(45,45,55,0.93);--edge-blur-color:rgba(45,45,55,0.18)}
[data-theme="dark"][data-bg="neutral"]{--content-bg:rgba(30,30,40,0.88);--sidebar-content-bg:rgba(35,35,50,0.93);--header-content-bg:rgba(35,35,50,0.93);--bg:#1e1e28;--sidebar-bg:#232332;--edge-blur-color:rgba(0,0,0,0.14)}
[data-theme="dark"][data-bg="warm"]{--content-bg:rgba(40,35,28,0.88);--sidebar-content-bg:rgba(50,42,30,0.93);--header-content-bg:rgba(50,42,30,0.93);--bg:#282318;--sidebar-bg:#322a1e;--edge-blur-color:rgba(0,0,0,0.14)}
[data-theme="dark"][data-bg="cool"]{--content-bg:rgba(26,30,42,0.88);--sidebar-content-bg:rgba(30,38,55,0.93);--header-content-bg:rgba(30,38,55,0.93);--bg:#1a1e2a;--sidebar-bg:#1e2637;--edge-blur-color:rgba(0,0,0,0.14)}

.bg-layer{position:fixed;inset:0;z-index:-3;overflow:hidden;background:var(--bg)}
.bg-video{position:absolute;width:100%;height:100%;object-fit:cover;opacity:0}
.bg-image{position:absolute;width:100%;height:100%;object-fit:cover;opacity:0}
.bg-blur-overlay{position:fixed;inset:0;z-index:-2;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.bg-edge-left,.bg-edge-right{position:fixed;top:0;bottom:0;z-index:-1;pointer-events:none}
.bg-edge-left{left:0;width:calc((100% - 860px - var(--sidebar-width)) / 2 + var(--sidebar-width));backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);background:var(--edge-blur-color)}
.bg-edge-right{right:0;width:calc((100% - 860px) / 2);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);background:var(--edge-blur-color)}
@media(max-width:768px){
  .bg-edge-left{left:0;width:50%}
  .bg-edge-right{right:0;width:50%}
}

.sidebar,.main-header,.content-wrapper,.menu-dropdown{background:var(--content-bg)}
.sidebar{background:var(--sidebar-content-bg)}
.main-header{background:var(--header-content-bg)}
.menu-dropdown{background:var(--sidebar-content-bg)}
.search-box{background:var(--content-bg)}

.overlay{display:none;position:fixed;inset:0;background:var(--overlay-bg);z-index:50}
.overlay.show{display:block}

body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;color:var(--text);height:100vh;display:flex;overflow:hidden;position:relative}
.sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);height:100vh;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;z-index:100}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:20px;font-weight:700;color:var(--accent)}
.sidebar-header p{font-size:12px;color:var(--text-secondary);margin-top:4px}
.search-box{margin:12px 16px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:var(--font-sidebar);outline:none;transition:border-color .2s;color:var(--text)}
.search-box:focus{border-color:var(--accent)}
.search-box::placeholder{color:var(--text-secondary)}
.tree-wrapper{flex:1;overflow-y:auto;padding:8px 0}
.tree-wrapper::-webkit-scrollbar{width:6px}
.tree-wrapper::-webkit-scrollbar-thumb{background:var(--text-secondary);border-radius:3px}
.tree-item{cursor:pointer;user-select:none}
.tree-item-inner{display:flex;align-items:center;gap:6px;padding:6px 16px;font-size:var(--font-sidebar);color:var(--text);transition:background .15s}
.tree-item-inner:hover{background:var(--hover)}
.tree-item-inner.active{background:var(--active);color:var(--accent);font-weight:600}
.tree-icon{width:16px;text-align:center;flex-shrink:0;font-size:12px;color:var(--text-secondary)}
.tree-arrow{width:16px;flex-shrink:0;transition:transform .2s;font-size:10px;color:var(--text-secondary)}
.tree-arrow.open{transform:rotate(90deg)}
.tree-children{display:none}
.tree-children.open{display:block}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-header{display:flex;align-items:center;padding:8px 20px;border-bottom:1px solid var(--border);gap:8px;min-height:52px}
.hamburger{display:none;background:none;border:none;font-size:20px;cursor:pointer;padding:4px 8px;color:var(--text);border-radius:4px}
.hamburger:hover{background:var(--hover)}
.desktop-title{font-size:var(--font-title);font-weight:600;color:var(--accent);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.header-btn{background:none;border:1px solid var(--border);font-size:18px;cursor:pointer;padding:6px 10px;color:var(--text);border-radius:6px;transition:all .2s;line-height:1;display:flex;align-items:center;justify-content:center}
.header-btn:hover{background:var(--hover);border-color:var(--accent)}
.menu-dropdown{position:fixed;right:20px;top:52px;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:8px 12px;min-width:220px;z-index:200;display:none}
.menu-dropdown.open{display:block}
.menu-section{padding:4px 4px 6px;font-size:11px;font-weight:600;color:var(--text-secondary);letter-spacing:1px;text-transform:uppercase}
.bg-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 0 8px 0}
.bg-grid-item{text-align:center;padding:8px 4px;font-size:13px;color:var(--text);cursor:pointer;border-radius:6px;transition:all .2s;background:var(--bg);border:1px solid var(--border)}
.bg-grid-item:hover{background:var(--hover);border-color:var(--accent)}
.bg-grid-item.active{background:var(--active);color:var(--accent);font-weight:600;border-color:var(--accent)}
.font-row{display:flex;gap:6px;padding:8px 0 4px}
.font-item{flex:1;text-align:center;padding:8px 4px;font-size:13px;color:var(--text);cursor:pointer;border-radius:6px;transition:all .2s;background:var(--bg);border:1px solid var(--border)}
.font-item:hover{background:var(--hover);border-color:var(--accent)}
.font-item.active{background:var(--active);color:var(--accent);font-weight:600;border-color:var(--accent)}
.menu-divider{border:none;border-top:1px solid var(--border);margin:4px 0}
.music-player{padding:4px 4px 8px}
.music-info{font-size:13px;color:var(--accent);font-weight:600;text-align:center;padding:6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-controls{display:flex;gap:6px;justify-content:center}
.music-btn{background:none;border:1px solid var(--border);font-size:18px;cursor:pointer;padding:6px 14px;color:var(--text);border-radius:6px;transition:all .2s;line-height:1}
.music-btn:hover{background:var(--hover);border-color:var(--accent)}
.music-btn.playing{background:var(--active);border-color:var(--accent)}
.content-wrapper{flex:1;overflow-y:auto;padding:40px;max-width:860px;width:100%;margin:0 auto}
.content-wrapper::-webkit-scrollbar{width:8px}
.content-wrapper::-webkit-scrollbar-thumb{background:var(--text-secondary);border-radius:4px}
.markdown-body{line-height:1.8;font-size:var(--font-md-body);color:var(--text)}
.markdown-body h1{font-size:var(--font-md-h1);font-weight:700;margin-bottom:24px;padding-bottom:12px;border-bottom:2px solid var(--border)}
.markdown-body h2{font-size:var(--font-md-h2);font-weight:600;margin:28px 0 12px}
.markdown-body h3{font-size:var(--font-md-h3);font-weight:600;margin:24px 0 8px}
.markdown-body p{margin:12px 0}
.markdown-body ul,.markdown-body ol{margin:8px 0;padding-left:24px}
.markdown-body li{margin:4px 0}
.markdown-body code{background:var(--code-bg);padding:2px 6px;border-radius:4px;font-size:calc(var(--font-md-body) - 2px);font-family:"Fira Code","Consolas",monospace;color:var(--text)}
.markdown-body pre{background:var(--code-bg);padding:16px;border-radius:8px;overflow-x:auto;margin:16px 0}
.markdown-body pre code{background:none;padding:0;font-size:calc(var(--font-md-body) - 2px)}
.markdown-body blockquote{border-left:4px solid var(--accent);padding:8px 16px;margin:16px 0;background:var(--blockquote-bg);color:var(--text-secondary)}
.markdown-body img{max-width:100%;border-radius:8px;margin:16px 0;box-shadow:var(--img-shadow)}
.markdown-body a{color:var(--accent);text-decoration:none}
.markdown-body a:hover{text-decoration:underline}
.markdown-body hr{border:none;border-top:1px solid var(--border);margin:24px 0}
.markdown-body table{width:100%;border-collapse:collapse;margin:16px 0}
.markdown-body th,.markdown-body td{border:1px solid var(--border);padding:8px 12px;text-align:left}
.markdown-body th{background:var(--hover);font-weight:600}
.markdown-body strong{font-weight:700}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-secondary)}
.empty-state h2{font-size:24px;margin-bottom:8px}
.empty-state p{font-size:14px}
@media(max-width:768px){
.hamburger{display:block}
.main-header{padding:8px 12px}
.sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:var(--shadow);transition:transform .3s ease}
.sidebar.open{transform:translateX(0)}
.content-wrapper{padding:20px 16px}
.markdown-body{font-size:var(--font-md-body)}
.markdown-body h1{font-size:var(--font-md-h1)}
.markdown-body h2{font-size:var(--font-md-h2)}
.markdown-body h3{font-size:var(--font-md-h3)}
.desktop-title{display:none}
.header-actions{margin-left:auto}
.menu-dropdown{right:12px}
}
</style>
</head>
<body>
<div class="bg-layer" id="bgLayer">
  <video class="bg-video" id="bgVideo" muted loop playsinline preload="auto"></video>
  <img class="bg-image" id="bgImage" alt="" style="display:none">
</div>
<div class="bg-blur-overlay"></div>
<div class="bg-edge-left"></div>
<div class="bg-edge-right"></div>

<audio id="bgAudio" preload="auto" style="display:none"></audio>

<div class="overlay" id="overlay"></div>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>📝 个人博客</h1>
    <p>— 风清月白</p>
  </div>
  <input class="search-box" id="searchBox" type="text" placeholder="搜索文章..." oninput="filterTree(this.value)">
  <div class="tree-wrapper" id="treeWrapper"></div>
</nav>

<div class="main">
  <div class="main-header">
    <button class="hamburger" id="hamburgerBtn">☰</button>
    <span class="desktop-title" id="desktopTitle">📝 个人博客</span>
    <span id="mobileTitle" style="font-size:15px;font-weight:600;color:var(--text);display:none;">个人博客</span>
    <div class="header-actions">
      <button class="header-btn" id="themeToggle" title="切换深浅色模式">🌙</button>
      <button class="header-btn" id="menuBtn" title="菜单">☰</button>
    </div>
  </div>
  <div class="menu-dropdown" id="menuDropdown">
    <div class="menu-section">背景</div>
    <div class="bg-grid">
      <div class="bg-grid-item active" data-bg-option="video">🎬 视频</div>
      <div class="bg-grid-item" data-bg-option="neutral">⬜ 中性</div>
      <div class="bg-grid-item" data-bg-option="warm">🟨 暖色</div>
      <div class="bg-grid-item" data-bg-option="cool">🟦 冷色</div>
    </div>
    <hr class="menu-divider">
    <div class="menu-section">字体</div>
    <div class="font-row">
      <div class="font-item" data-font-option="small">A⁻ 小字</div>
      <div class="font-item active" data-font-option="default">A 默认</div>
      <div class="font-item" data-font-option="large">A⁺ 大字</div>
    </div>
    <hr class="menu-divider">
    <div class="menu-section">音乐</div>
    <div class="music-player" id="musicPlayer">
      <div class="music-info" id="musicTitle">未播放</div>
      <div class="music-controls">
        <button class="music-btn" id="musicPrev" title="上一首">⏮</button>
        <button class="music-btn" id="musicToggle" title="播放/暂停">▶️</button>
        <button class="music-btn" id="musicNext" title="下一首">⏭</button>
      </div>
    </div>
  </div>
  <div class="content-wrapper" id="contentWrapper">
    <div class="empty-state" id="emptyState">
      <h2>👋 欢迎</h2>
      <p>从左侧目录选择一篇文章开始阅读</p>
    </div>
    <div class="markdown-body" id="markdownBody" style="display:none;"></div>
  </div>
</div>

<script>
// ─── 深浅色模式 ───
(function() {
  const saved = localStorage.getItem('theme');
  if (saved === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  } else if (saved === 'light') {
    document.documentElement.removeAttribute('data-theme');
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();

function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  if (isDark) {
    html.removeAttribute('data-theme');
    localStorage.setItem('theme', 'light');
    document.getElementById('themeToggle').textContent = '🌙';
  } else {
    html.setAttribute('data-theme', 'dark');
    localStorage.setItem('theme', 'dark');
    document.getElementById('themeToggle').textContent = '☀️';
  }
  updateBackground();
}
document.getElementById('themeToggle').addEventListener('click', toggleTheme);

(function() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
})();

// ─── 背景切换 ───
function getBgOption() {
  return localStorage.getItem('bgOption') || 'video';
}

function setBgOption(opt) {
  localStorage.setItem('bgOption', opt);
  document.documentElement.setAttribute('data-bg', opt === 'video' ? '' : opt);
  document.querySelectorAll('.bg-grid-item').forEach(el => {
    el.classList.toggle('active', el.dataset.bgOption === opt);
  });
  updateBackground();
}

function updateBackground() {
  const opt = getBgOption();
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const isMobile = window.innerWidth <= 768;
  const videoEl = document.getElementById('bgVideo');
  const imgEl = document.getElementById('bgImage');

  if (videoEl.style.display !== 'none') { videoEl.style.opacity = '0'; }
  if (imgEl.style.display !== 'none') { imgEl.style.opacity = '0'; }

  setTimeout(function() {
    if (opt === 'video') {
      if (isMobile) {
        videoEl.style.display = 'none';
      imgEl.src = isDark ? '/static/bgv/dark_bg.jpg' : '/static/bgv/light_bg.jpg';
        imgEl.style.display = 'block';
        imgEl.onload = function() { requestAnimationFrame(function() { imgEl.style.opacity = '1'; }); };
        if (imgEl.complete) { requestAnimationFrame(function() { imgEl.style.opacity = '1'; }); }
      } else {
        imgEl.style.display = 'none';
        videoEl.style.opacity = '0';
        videoEl.src = isDark ? '/static/bgv/dark_bg.mp4' : '/static/bgv/light_bg.mp4';
        videoEl.style.display = 'block';
        videoEl.onloadeddata = function() {
          requestAnimationFrame(function() { videoEl.style.opacity = '1'; });
          videoEl.play().catch(function(){});
        };
        if (videoEl.readyState >= 2) {
          requestAnimationFrame(function() { videoEl.style.opacity = '1'; });
          videoEl.play().catch(function(){});
        }
      }
    } else {
      videoEl.style.display = 'none';
      imgEl.style.display = 'none';
    }
  }, 300);
}

(function() {
  const savedBg = localStorage.getItem('bgOption');
  if (savedBg && savedBg !== 'video') {
    document.documentElement.setAttribute('data-bg', savedBg);
    document.querySelectorAll('.bg-grid-item').forEach(el => {
      if (el.dataset.bgOption === savedBg) el.classList.add('active');
    });
  }
  updateBackground();
})();

document.querySelectorAll('.bg-grid-item').forEach(el => {
  el.addEventListener('click', function(e) {
    e.stopPropagation();
    setBgOption(this.dataset.bgOption);
  });
});

window.addEventListener('resize', function() {
  if (getBgOption() === 'video') updateBackground();
});

// ─── 字体大小切换 ───
function getFontOption() {
  return localStorage.getItem('fontOption') || 'default';
}

function setFontOption(opt) {
  localStorage.setItem('fontOption', opt);
  document.documentElement.setAttribute('data-font', opt === 'default' ? '' : opt);
  document.querySelectorAll('.font-item').forEach(el => {
    el.classList.toggle('active', el.dataset.fontOption === opt);
  });
}

(function() {
  const savedFont = localStorage.getItem('fontOption');
  if (savedFont && savedFont !== 'default') {
    document.documentElement.setAttribute('data-font', savedFont);
    document.querySelectorAll('.font-item').forEach(el => {
      if (el.dataset.fontOption === savedFont) el.classList.add('active');
    });
  }
})();

document.querySelectorAll('.font-item').forEach(el => {
  el.addEventListener('click', function(e) {
    e.stopPropagation();
    setFontOption(this.dataset.fontOption);
  });
});

// ─── 音乐播放器 ───
const playlist = window.__PLAYLIST__ || [];
let currentTrack = parseInt(localStorage.getItem('musicTrack') || '0');
const audioEl = document.getElementById('bgAudio');

function loadTrack(index) {
  if (playlist.length === 0) return;
  if (index < 0) index = playlist.length - 1;
  if (index >= playlist.length) index = 0;
  currentTrack = index;
  localStorage.setItem('musicTrack', currentTrack);
  const song = playlist[currentTrack];
  document.getElementById('musicTitle').textContent = song.name;
  audioEl.src = '/' + song.file;
  audioEl.load();
  audioEl.onloadedmetadata = function() {
    audioEl.currentTime = parseFloat(localStorage.getItem('musicTime') || '0');
    audioEl.play().catch(function(){});
  };
  document.getElementById('musicToggle').textContent = '▶️';
  document.getElementById('musicToggle').classList.add('playing');
}

function togglePlay() {
  if (playlist.length === 0) return;
  if (audioEl.paused) {
    if (!audioEl.src) { loadTrack(currentTrack); return; }
    audioEl.play().catch(function(){});
    document.getElementById('musicToggle').textContent = '⏸';
    document.getElementById('musicToggle').classList.add('playing');
  } else {
    audioEl.pause();
    document.getElementById('musicToggle').textContent = '▶️';
    document.getElementById('musicToggle').classList.remove('playing');
  }
}

function nextTrack() { loadTrack(currentTrack + 1); }
function prevTrack() { loadTrack(currentTrack - 1); }

audioEl.addEventListener('timeupdate', function() {
  localStorage.setItem('musicTime', audioEl.currentTime);
});

audioEl.addEventListener('ended', function() { nextTrack(); });

if (playlist.length > 0) {
  const savedTime = parseFloat(localStorage.getItem('musicTime') || '0');
  if (savedTime > 0 || localStorage.getItem('musicTrack')) {
    loadTrack(currentTrack);
  }
  document.getElementById('musicTitle').textContent = playlist[currentTrack].name;
}

document.getElementById('musicToggle').addEventListener('click', function(e) {
  e.stopPropagation(); togglePlay();
});
document.getElementById('musicNext').addEventListener('click', function(e) {
  e.stopPropagation(); nextTrack();
});
document.getElementById('musicPrev').addEventListener('click', function(e) {
  e.stopPropagation(); prevTrack();
});

// ─── 菜单下拉 ───
document.getElementById('menuBtn').addEventListener('click', function(e) {
  e.stopPropagation();
  document.getElementById('menuDropdown').classList.toggle('open');
});
document.addEventListener('click', function() {
  document.getElementById('menuDropdown').classList.remove('open');
});
document.getElementById('menuDropdown').addEventListener('click', function(e) {
  e.stopPropagation();
});

// ─── 应用初始化 ───
initApp();

function initApp() {
  if (treeData.length === 0) {
    document.getElementById('treeWrapper').innerHTML = '<p style="padding:20px;color:#d32f2f;">❌ 请先运行 node scripts/build.js 构建</p>';
    return;
  }
  renderTree(treeData, document.getElementById('treeWrapper'));

  if (articlePath && contentMap[articlePath]) {
    expandToPath(articlePath);
    const el = document.querySelector(`[data-path="${articlePath}"]`);
    loadFile(articlePath, el || null);
  } else {
    const first = findFirstFile(treeData);
    if (first && contentMap[first.path]) {
      setTimeout(() => {
        const el = document.querySelector(`[data-path="${first.path}"]`);
        if (el) el.click();
      }, 100);
    }
  }
}

function expandToPath(filePath) {
  const parts = filePath.split('/');
  const dirParts = parts.slice(0, -1);
  var items = document.querySelectorAll('.tree-item');
  for (var i = 0; i < items.length; i++) {
    var inner = items[i].querySelector('.tree-item-inner');
    if (!inner) continue;
    var arrow = inner.querySelector('.tree-arrow');
    if (!arrow) continue;
    var folderName = inner.querySelector('span:last-child').textContent;
    for (var j = 1; j < dirParts.length; j++) {
      if (dirParts[j] === folderName) {
        arrow.classList.add('open');
        var ch = items[i].querySelector('.tree-children');
        if (ch) ch.classList.add('open');
        break;
      }
    }
  }
}

function renderTree(nodes, container, depth) {
  if (depth === undefined) depth = 0;
  for (const node of nodes) {
    if (node.type === 'folder' && node.name === 'images') continue;
    const item = document.createElement('div');
    item.className = 'tree-item';

    if (node.type === 'folder') {
      const inner = document.createElement('div');
      inner.className = 'tree-item-inner';
      inner.style.paddingLeft = (16 + depth * 16) + 'px';
      inner.innerHTML = '<span class="tree-arrow">▶</span><span class="tree-icon">📁</span><span>' + esc(node.name) + '</span>';
      inner.addEventListener('click', function(e) {
        e.stopPropagation();
        this.querySelector('.tree-arrow').classList.toggle('open');
        item.querySelector('.tree-children').classList.toggle('open');
      });
      item.appendChild(inner);
      const children = document.createElement('div');
      children.className = 'tree-children';
      renderTree(node.children || [], children, depth + 1);
      item.appendChild(children);
    } else {
      const inner = document.createElement('div');
      inner.className = 'tree-item-inner';
      const label = node.label === 'index'
        ? (node.path.split('/').slice(-2, -1)[0] || '首页')
        : node.label;
      inner.style.paddingLeft = (16 + depth * 16) + 'px';
      inner.innerHTML = '<span class="tree-icon">' + getIcon(node.path) + '</span><span>' + esc(label) + '</span>';
      inner.dataset.path = node.path;
      inner.addEventListener('click', function() {
        window.location.href = getArticleUrl(node.path);
      });
      item.appendChild(inner);
    }
    container.appendChild(item);
  }
}

function getArticleUrl(filePath) {
  let url = filePath
    .replace(/^content\//, '')
    .replace(/\/index\.md$/, '/index.html')
    .replace(/\.md$/, '.html');
  return '/' + url;
}

function getIcon(path) {
  const name = path.split('/').pop();
  if (name === '关于.md') return 'ℹ️';
  if (name === '留言.md') return '💬';
  if (name === '个人博客.md') return '📰';
  if (name === 'index.md') return '🏠';
  return '📄';
}

function esc(t) {
  var d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

function loadFile(path, element) {
  var actives = document.querySelectorAll('.tree-item-inner.active');
  for (var i = 0; i < actives.length; i++) actives[i].classList.remove('active');
  if (element) element.classList.add('active');

  var mdText = contentMap[path];
  if (!mdText) {
    document.getElementById('markdownBody').innerHTML = '<p style="color:#d32f2f;">❌ 文章内容未找到</p>';
    return;
  }

  document.getElementById('emptyState').style.display = 'none';
  var mdBody = document.getElementById('markdownBody');
  mdBody.style.display = 'block';

  var basePath = path.lastIndexOf('/') !== -1 ? path.substring(0, path.lastIndexOf('/')) : 'content';
  var processed = mdText.replace(/!\[([^\]]*)\]\(\.\/images\//g, '![$1](' + basePath + '/images/');
  mdBody.innerHTML = marked.parse(processed);

  var imgs = mdBody.querySelectorAll('img');
  for (var i = 0; i < imgs.length; i++) {
    imgs[i].style.cursor = 'zoom-in';
    imgs[i].addEventListener('click', function() { window.open(this.src, '_blank'); });
  }

  if (quotesData.length > 0) {
    var quoteEl = mdBody.querySelector('.random-quote');
    if (quoteEl && quoteEl.textContent.indexOf('正在加载') !== -1) {
      var idx = Math.floor(Math.random() * quotesData.length);
      var q = quotesData[idx];
      quoteEl.textContent = '「 ' + q.text + ' 」';
    }
  }

  var label = element ? element.querySelector('span:last-child').textContent : '';
  document.getElementById('desktopTitle').textContent = '📝 ' + (label || '个人博客');
  document.getElementById('mobileTitle').textContent = label || '个人博客';
  closeSidebar();
}

function filterTree(query) {
  var items = document.querySelectorAll('.tree-item');
  var q = query.toLowerCase().trim();
  var children = document.querySelectorAll('.tree-children');
  var arrows = document.querySelectorAll('.tree-arrow');
  for (var i = 0; i < children.length; i++) children[i].classList.remove('open');
  for (var i = 0; i < arrows.length; i++) arrows[i].classList.remove('open');
  if (!q) { for (var i = 0; i < items.length; i++) items[i].style.display = ''; return; }
  for (var i = 0; i < items.length; i++) {
    var text = items[i].textContent.toLowerCase();
    items[i].style.display = text.indexOf(q) !== -1 ? '' : 'none';
    if (text.indexOf(q) !== -1) {
      var ch = items[i].querySelector('.tree-children');
      var ar = items[i].querySelector('.tree-arrow');
      if (ch) ch.classList.add('open');
      if (ar) ar.classList.add('open');
    }
  }
}

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
document.getElementById('hamburgerBtn').addEventListener('click', openSidebar);
document.getElementById('overlay').addEventListener('click', closeSidebar);

function findFirstFile(nodes) {
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].type === 'file' && nodes[i].name === 'index.md') return nodes[i];
  }
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].type === 'file') return nodes[i];
    if (nodes[i].children) { var f = findFirstFile(nodes[i].children); if (f) return f; }
  }
  return null;
}
</script>
