.top-btn{position:absolute;bottom:24px;right:24px;width:42px;height:42px;border-radius:50%;background:var(--bg);color:var(--text-secondary);font-size:18px;font-weight:700;line-height:42px;text-align:center;cursor:pointer;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.2);opacity:0;pointer-events:none;user-select:none;touch-action:none;border:1px solid var(--border);transition:opacity .25s ease,transform .25s ease,background .25s ease,color .25s ease}

<script>
(function(){var s=localStorage.getItem('theme');if(s==='dark')document.documentElement.setAttribute('data-theme','dark');else if(!s&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.setAttribute('data-theme','dark')})();
function toggleTheme(){var h=document.documentElement,d=h.getAttribute('data-theme')==='dark';d?h.removeAttribute('data-theme'):h.setAttribute('data-theme','dark');localStorage.setItem('theme',d?'light':'dark');document.getElementById('themeToggle').textContent=d?'🌙':'☀️';updateBackground();var f=document.querySelector('iframe.giscus-frame');if(f)f.contentWindow.postMessage({giscus:{setConfig:{theme:d?'light':'dark'}}},'https://giscus.app')}
document.getElementById('themeToggle').addEventListener('click',toggleTheme);
(function(){document.getElementById('themeToggle').textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌙'})();
