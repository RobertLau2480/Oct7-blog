<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · 安巢鸟</title>
    <style>
        /* === 全局重置 & 压缩命名 === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #080c18;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(26, 51, 92, .25) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(26, 51, 92, .15) 0%, transparent 60%);
        }

        /* === 主容器 === */
        .wrap {
            width: 100%;
            max-width: 1020px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 36px 50px;
            background: #0d1426;
            padding: 48px 44px 36px;
            border: 1px solid #1e2d4a;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .04);
            position: relative;
            border-radius: 0;
        }
        .wrap::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #1a3a6a, #3a7bd5, #1a3a6a);
            border-radius: 0;
        }

        /* 四角直角装饰 */
        .cb {
            position: absolute;
            width: 16px;
            height: 16px;
            border: 1px solid #1a2a4a;
            border-radius: 0;
            pointer-events: none;
            opacity: .5;
        }
        .cb.tl {
            top: 12px;
            left: 12px;
            border-right: none;
            border-bottom: none;
        }
        .cb.tr {
            top: 12px;
            right: 12px;
            border-left: none;
            border-bottom: none;
        }
        .cb.bl {
            bottom: 12px;
            left: 12px;
            border-right: none;
            border-top: none;
        }
        .cb.br {
            bottom: 12px;
            right: 12px;
            border-left: none;
            border-top: none;
        }

        /* === 左侧数字 === */
        .visual {
            flex: 1 1 300px;
            min-width: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .num {
            font-size: clamp(110px, 18vw, 200px);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -6px;
            color: #e8edf5;
            text-shadow: 0 0 30px rgba(58, 123, 213, .15);
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .num .ring {
            display: inline-block;
            position: relative;
            margin: 0 2px;
        }
        .num .ring::after {
            content: '';
            position: absolute;
            inset: -6px;
            border: 2px solid rgba(58, 123, 213, .2);
            border-radius: 0;
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: .3;
                transform: scale(1);
            }
            50% {
                opacity: .9;
                transform: scale(1.06);
            }
        }
        .visual .line {
            width: 70px;
            height: 3px;
            background: #1e2d4a;
            margin: 14px 0 16px;
            border-radius: 0;
            position: relative;
        }
        .visual .line::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 40%;
            height: 100%;
            background: #3a7bd5;
            border-radius: 0;
            animation: slide 4s ease-in-out infinite;
        }
        @keyframes slide {
            0%,
            100% {
                width: 40%;
                left: 0;
            }
            50% {
                width: 70%;
                left: 30%;
            }
        }
        .visual .label {
            font-size: 13px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #4a6a96;
            font-weight: 400;
            opacity: .7;
        }

        /* === 右侧内容 === */
        .content {
            flex: 1 1 340px;
            min-width: 220px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .content .badge {
            display: inline-block;
            background: #111d33;
            padding: 5px 14px;
            border: 1px solid #1e2d4a;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #6a8ab5;
            margin-bottom: 20px;
            border-radius: 0;
            font-weight: 500;
        }
        .content h1 {
            font-size: clamp(26px, 4.8vw, 46px);
            font-weight: 600;
            color: #e8edf5;
            line-height: 1.15;
            margin-bottom: 14px;
            letter-spacing: -.5px;
        }
        .content h1 span {
            color: #3a7bd5;
            border-bottom: 2px solid #3a7bd5;
            padding-bottom: 2px;
        }
        .content .desc {
            font-size: 15px;
            line-height: 1.7;
            color: #8aa3c9;
            max-width: 420px;
            margin-bottom: 28px;
            font-weight: 350;
        }
        .content .desc strong {
            color: #b0c8e8;
            font-weight: 500;
        }

        /* === 按钮组 === */
        .acts {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 14px;
            margin-top: 2px;
            width: 100%;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 30px;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: .2px;
            text-decoration: none;
            background: transparent;
            border: 1px solid #1e2d4a;
            color: #b0c8e8;
            transition: all .25s ease;
            cursor: pointer;
            border-radius: 0;
            font-family: inherit;
            min-height: 50px;
            position: relative;
            flex: 1 1 auto;
            min-width: 130px;
            text-align: center;
        }
        .btn-p {
            background: #1a3a6a;
            border-color: #1a3a6a;
            color: #fff;
            box-shadow: 0 0 0 0 rgba(58, 123, 213, 0);
        }
        .btn-p:hover {
            background: #234f8a;
            border-color: #234f8a;
            box-shadow: 0 0 28px rgba(58, 123, 213, .2);
            transform: translateY(-2px);
        }
        .btn-p:active {
            transform: translateY(0);
        }
        .btn-s {
            background: transparent;
            border-color: #1e2d4a;
            color: #8aa3c9;
        }
        .btn-s:hover {
            background: #111d33;
            border-color: #2a4a7a;
            color: #e8edf5;
            transform: translateY(-2px);
        }
        .btn .arr {
            display: inline-block;
            margin-left: 8px;
            transition: transform .25s ease;
        }
        .btn:hover .arr {
            transform: translateX(5px);
        }

        /* === 页脚 === */
        .ft {
            width: 100%;
            margin-top: 34px;
            padding-top: 20px;
            border-top: 1px solid #111d33;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .ft .brand {
            font-size: 13px;
            font-weight: 400;
            color: #4a6a96;
            letter-spacing: .5px;
        }
        .ft .brand strong {
            color: #6a8ab5;
            font-weight: 500;
        }
        .ft .status {
            font-size: 12px;
            color: #3a5a7a;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }
        .ft .status .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #3a7bd5;
            border-radius: 0;
            animation: blink 2s step-end infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: .15;
            }
        }

        /* === 响应式 === */
        @media (max-width: 760px) {
            .wrap {
                padding: 32px 24px 28px;
                gap: 28px;
                flex-direction: column;
                align-items: stretch;
            }
            .content {
                align-items: center;
                text-align: center;
            }
            .content .desc {
                max-width: 100%;
            }
            .acts {
                justify-content: center;
            }
            .btn {
                flex: 1 1 100%;
                min-width: unset;
            }
            .ft {
                flex-direction: column;
                text-align: center;
                gap: 6px;
            }
            .num {
                font-size: clamp(90px, 28vw, 150px);
                letter-spacing: -4px;
            }
            .visual .line {
                width: 50px;
            }
            .cb {
                display: none;
            }
        }
        @media (max-width: 420px) {
            .wrap {
                padding: 24px 16px 20px;
                gap: 20px;
            }
            .btn {
                padding: 11px 18px;
                font-size: 14px;
                min-height: 46px;
            }
            .content h1 {
                font-size: 24px;
            }
            .content .desc {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="wrap">

        <!-- 四角装饰 -->
        <span class="cb tl"></span>
        <span class="cb tr"></span>
        <span class="cb bl"></span>
        <span class="cb br"></span>

        <!-- 左侧数字 -->
        <div class="visual">
            <div class="num">
                4
                <span class="ring">0</span>
                4
            </div>
            <div class="line"></div>
            <div class="label">Page Not Found</div>
        </div>

        <!-- 右侧内容 -->
        <div class="content">
            <div class="badge">● 错误 404</div>
            <h1>
                好像<br />
                <span>迷失</span>了方向
            </h1>
            <p class="desc">
                您访问的页面可能已被移除或暂时不可用。<br />
                <strong>回到安全地带，继续探索。</strong>
            </p>

            <div class="acts">
                <a href="/" class="btn btn-p">
                    回到首页
                    <span class="arr">→</span>
                </a>
                <a href="#" class="btn btn-s" onclick="history.back();return false;">
                    返回上页
                    <span class="arr">↺</span>
                </a>
            </div>
        </div>

        <!-- 页脚：品牌 + 状态 -->
        <div class="ft">
            <div class="brand">
                <strong>安巢鸟的个人网站</strong> · HomewardBird's Site
            </div>
            <div class="status">
                <span class="dot"></span>
                HTTP 404 · 运行中
            </div>
        </div>

    </div>

    <!-- 极简JS：仅用于处理返回按钮的降级（几乎无性能开销） -->
    <script>
        // 如果history.back()无效（例如直接打开此页面），确保按钮行为优雅。
        document.querySelector('.btn-s')?.addEventListener('click', function(e) {
            // 如果history长度小于2，则跳转到首页
            if (window.history.length <= 1) {
                e.preventDefault();
                window.location.href = '/';
            }
        });
    </script>

</body>
</html>
