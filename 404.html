<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - 页面未找到</title>
<link rel="icon" type="image/png" href="/static/icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f8f9fa;--border:#e0e0e0;--text:#333;--text-secondary:#666;--accent:#1976d2;--shadow:0 2px 8px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:rgba(248,249,250,.92);padding:48px 56px;border-radius:16px;border:1px solid var(--border);box-shadow:var(--shadow);text-align:center;max-width:420px;width:90%}
.code{font-size:80px;font-weight:800;color:var(--accent);line-height:1;margin-bottom:8px}
.title{font-size:20px;font-weight:600;margin-bottom:12px}
.desc{font-size:14px;color:var(--text-secondary);line-height:1.6;margin-bottom:28px}
.btn{display:inline-block;padding:10px 28px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-size:14px;font-weight:600;transition:all .2s}
.btn:hover{opacity:.85;transform:translateY(-1px)}
</style>
</head>
<body>
<div class="box">
<div class="code">404</div>
<div class="title">⛔ 页面走丢了</div>
<div class="desc">你访问的页面不存在或已被移除。<br>不如回到首页看看？</div>
<a href="/" class="btn">🏠 返回首页</a>
</div>
<script>
(function(){var s=localStorage.getItem('theme');if(s==='dark'){document.documentElement.style.setProperty('--bg','#1a1a2e');document.documentElement.style.setProperty('--text','#e0e0e0');document.documentElement.style.setProperty('--text-secondary','#a0a0b0');document.documentElement.style.setProperty('--accent','#64b5f6');document.documentElement.style.setProperty('--border','#3a3a48')}})();
</script>
</body>
</html>
